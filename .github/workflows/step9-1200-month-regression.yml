name: STEP 9 1200-month Long Run

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  century-simulation:
    name: "1200 monthly closes (${{ matrix.era }} start)"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        era: [1900, 2020]
    steps:
      - name: Check out commit under test
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Long run with 100-month reports and 300-month save checks
        env:
          PYTHONUNBUFFERED: "1"
        run: python tests/test_step9_1200_months.py --era ${{ matrix.era }}
