name: v0.34 Inventory Forecast Regression
on:
  push:
    branches:
      - dev/v034-inventory-forecast
  pull_request:
    branches:
      - main

jobs:
  supply-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: v0.34 Inventory safety, lead times and monthly runs
        run: python tests/test_v034_inventory_forecast.py
      - name: v0.33 Finite world market and equitable allocations
        run: python tests/test_v033_npc_supply.py
      - name: v0.32 Resource inventories and partial fulfillment
        run: python tests/test_v032_supply_foundation.py
      - name: v0.31 Customer substitution and export receipts
        run: |
          python tests/test_v031_demand_allocation.py
          python tests/test_v031_exports.py
      - name: Research, material supply and manufacturing regressions
        run: |
          python tests/test_v030_research_supply.py
          python tests/test_v029_bom.py
          python tests/test_v029_trade.py
      - name: 120-month multi-firm and multi-factory regression
        run: python tests/test_v029_ai_investment.py
      - name: Previous save migration
        run: python tests/test_v0271_smoke.py
