name: Auto 3-Month Retention and Immutable Manual Saves

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/test_autosave_retention.py
      - .github/workflows/save-retention.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium and Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test autosave pruning, manual archive preservation and browser reload
        run: python tests/test_autosave_retention.py
