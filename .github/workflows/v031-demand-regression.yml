name: v0.31 Demand Allocation Regression

on:
  push:
    branches:
      - dev/v031-demand-reallocation
  pull_request:
    branches:
      - main

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tests
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: v0.31 Market allocation
        run: python tests/test_v031_demand_allocation.py
      - name: v0.31 Import delivery
        run: python tests/test_v031_exports.py
      - name: v0.30 Research and supplies
        run: python tests/test_v030_research_supply.py
      - name: v0.29 Manufacturing, trade and accounting
        run: |
          python tests/test_v029_bom.py
          python tests/test_v029_trade.py
      - name: v0.29 Long-term factory and AI regression (120 months)
        run: python tests/test_v029_ai_investment.py
      - name: v0.27 Save migration
        run: python tests/test_v0271_smoke.py
