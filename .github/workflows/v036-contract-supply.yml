name: v0.36 Supply Contract and Allocation Regression
on:
  push:
    branches:
      - dev/v036-contract-supply
      - dev/autonomous-step-01-resource-trade
      - dev/autonomous-step-02-inventory-logistics
      - dev/autonomous-step-03-supply-balance
      - dev/autonomous-step-04-supply-contracts
      - dev/autonomous-step-05-international-logistics
      - dev/autonomous-step-06-international-finance
      - dev/autonomous-step-07-market-entry
      - dev/autonomous-step-08-macro-risk
  pull_request:
    branches:
      - dev/v035-startup-supply-balance
      - dev/v036-contract-supply
      - dev/autonomous-step-01-resource-trade
      - dev/autonomous-step-02-inventory-logistics
      - dev/autonomous-step-03-supply-balance
      - dev/autonomous-step-04-supply-contracts
      - dev/autonomous-step-05-international-logistics
      - dev/autonomous-step-06-international-finance
      - dev/autonomous-step-07-market-entry
      - main

jobs:
  contract-supply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: v0.36 Contracts, physical supply and accounting
        run: python tests/test_v036_contract_supply.py
      - name: STEP 8 Macroeconomic and supply-chain risks
        if: ${{ hashFiles('tests/test_step08_macro_risk.py') != '' }}
        run: python tests/test_step08_macro_risk.py
      - name: STEP 7 Foreign plants and regional market entry
        if: ${{ hashFiles('tests/test_step07_market_entry.py') != '' }}
        run: |
          python tests/test_step07_market_entry.py
          python tests/test_v025_market.py
      - name: STEP 6 Currency balances and accounting
        if: ${{ hashFiles('tests/test_step06_foreign_finance.py') != '' }}
        run: python tests/test_step06_foreign_finance.py
      - name: STEP 5 International shipping, tariffs and inventory
        if: ${{ hashFiles('tests/test_step05_international_logistics.py') != '' }}
        run: python tests/test_step05_international_logistics.py
      - name: STEP 4 Corporate supply terms and settlement
        if: ${{ hashFiles('tests/test_step04_supply_contracts.py') != '' }}
        run: python tests/test_step04_supply_contracts.py
      - name: STEP 1 Resource transactions and inventory
        if: ${{ hashFiles('tests/test_step01_resource_trade.py') != '' }}
        run: python tests/test_step01_resource_trade.py
      - name: STEP 2 Factory and warehouse inventories
        if: ${{ hashFiles('tests/test_step02_inventory_logistics.py') != '' }}
        run: python tests/test_step02_inventory_logistics.py
      - name: STEP 3 Supply balance and manufacturing diagnostics
        if: ${{ hashFiles('tests/test_step03_supply_balance.py') != '' }}
        run: python tests/test_step03_supply_balance.py
      - name: STEP 3 Long-running supply balance and recession scenarios
        if: ${{ hashFiles('tests/test_step03_balance_endurance.py') != '' }}
        run: python tests/test_step03_balance_endurance.py
      - name: STEP 2 Long-running localized inventory and logistics
        if: ${{ hashFiles('tests/test_step02_inventory_endurance.py') != '' }}
        run: python tests/test_step02_inventory_endurance.py
      - name: STEP 1 Long-running resource ledgers and previous saves
        if: ${{ hashFiles('tests/test_step01_resource_endurance.py') != '' }}
        run: |
          python tests/test_step01_resource_endurance.py
          python tests/test_v029_ai_investment.py
          python tests/test_v0271_smoke.py
      - name: v0.35 Startup supply
        run: python tests/test_v035_startup_supply.py
      - name: v0.34 Forecast and order point regression
        run: python tests/test_v034_inventory_forecast.py
      - name: v0.33 NPC supply and fair allocations
        run: python tests/test_v033_npc_supply.py
      - name: v0.32 Backed stock and partial delivery
        run: python tests/test_v032_supply_foundation.py
      - name: Era supply balance diagnostics
        run: python tests/test_v033_supply_balance_probe.py
      - name: Earlier manufacturing and consolidated accounts
        run: |
          python tests/test_v029_bom.py
          python tests/test_v029_trade.py
          python tests/test_v031_demand_allocation.py

  corporate-contract-endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: STEP 4 Contract renewal, supply disruptions and ledger reconciliation
        run: python tests/test_step04_contract_endurance.py

  international-route-endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: STEP 5 International route, warehouse and customs endurance
        run: python tests/test_step05_route_endurance.py

  international-finance-endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: STEP 6 Foreign settlements, treasury, forwards and consolidated cash flow
        run: python tests/test_step06_finance_endurance.py

  market-entry-endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: STEP 7 Local production, market lifecycle and consolidated cash flow
        run: python tests/test_step07_market_endurance.py
