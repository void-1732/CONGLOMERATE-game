name: BOM Factory Staffing Regression
on:
  push:
    branches:
      - fix/bom-factory-staffing-20261119
  pull_request:
    branches:
      - dev/autonomous-step-09-global-supply-ai
    paths:
      - index.html
      - tests/test_bom_factory_staffing.py
      - tests/test_v026_factory_supply.py
      - tests/test_v029_bom.py
      - .github/workflows/bom-factory-staffing.yml

concurrency:
  group: bom-factory-staffing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  factory-staffing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify BOM-only factory staffing, production, materials and save
        run: python tests/test_bom_factory_staffing.py
      - name: Verify legacy factory labor and procurement
        run: python tests/test_v026_factory_supply.py
      - name: Verify BOM manufacture, logistics, assembly and ledger
        run: python tests/test_v029_bom.py
