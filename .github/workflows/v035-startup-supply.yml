name: v0.35 Startup Supply Balance
on:
  push:
    branches:
      - dev/v035-startup-supply-balance
  pull_request:
    branches:
      - main
jobs:
  startup-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Startup difficulty, accounting, save and 24 months
        run: python tests/test_v035_startup_supply.py
      - name: Earlier supply regression
        run: |
          python tests/test_v034_inventory_forecast.py
          python tests/test_v033_npc_supply.py
          python tests/test_v032_supply_foundation.py
      - name: Existing era balance probe
        run: python tests/test_v033_supply_balance_probe.py
