name: v0.34-dev.3 reload and factory production regressions
on:
  push:
    branches:
      - fix/save-reload-factory-zero-v034dev3-20261120
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test startup eras and safe recovery across game identities
        run: python tests/test_startup_recovery_v034dev3.py
      - name: Test v0.35 fail-closed storage recovery and factory metadata
        run: python tests/test_v035_recovery_guard.py
      - name: Test legacy common-component routes, real shipment, accounting and reload
        run: python tests/test_legacy_auto_routes_v035.py
      - name: Test persistence through real HTTP reload and IndexedDB failure
        run: python tests/test_reload_autosave_v034dev3.py
      - name: Test physical engine/body/electronic production after real hiring and construction
        run: python tests/test_real_specialist_factory_v034dev2.py
      - name: Test factory bulk settings, month-end utilization, and in-transit stocks
        run: python tests/test_specialist_bulk_ui_v034dev2.py
      - name: Test five factory manufacturing and logistics chain (real HTTP Playwright)
        run: python tests/test_five_factory_chain_v039.py
      - name: Test factory diagnostics, legacy component production and material shortages
        run: python tests/test_factory_diagnostic_constraints_v034dev3.py
      - name: Test zero-plan old factories recover even without an assembler
        run: python tests/test_factory_idle_recovery_v034dev3.py
      - name: Test old-save factory recovery and BOM production
        run: |
          python tests/test_main_support_factory_auto_restore.py
          python tests/test_main_bom_factory_staffing.py
      - name: Test historical operational regression including agency accounting
        run: python tests/test_fix_four_operational_issues.py
      - name: Test inventory forecast, demand and intra-company parts trading
        run: |
          python tests/test_v034_inventory_forecast.py
          python tests/test_v031_demand_allocation.py
          python tests/test_v029_trade.py
          python tests/test_v029_ai_investment.py
