name: STEP 9 Focused Supply and Market Regression

on:
  push:
    branches:
      - dev/autonomous-step-09-global-supply-ai
    paths:
      - index.html
      - tests/test_step09_global_ai.py
      - tests/test_step09_market_readiness.py
      - tests/test_step09_market_expansion.py
      - tests/test_step09_trade_settlement.py
      - tests/test_step09_trade_endurance.py
      - .github/workflows/step09-fast.yml
  pull_request:
    branches:
      - dev/autonomous-step-08-macro-risk
    paths:
      - index.html
      - tests/test_step09_global_ai.py
      - tests/test_step09_market_readiness.py
      - tests/test_step09_market_expansion.py
      - tests/test_step09_trade_settlement.py
      - tests/test_step09_trade_endurance.py
      - .github/workflows/step09-fast.yml

concurrency:
  group: step09-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  step09-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: STEP 9 supply, logistics, group sourcing and market maturation
        run: python tests/test_step09_global_ai.py
      - name: STEP 9 market expansion compatibility and baseline audit
        run: python tests/test_step09_market_readiness.py
      - name: STEP 9 opt-in CN IN BR catalog, save migration and month-end accounting
        run: python tests/test_step09_market_expansion.py

      - name: STEP 9 CN IN BR physical trade, customs and currency settlement
        run: python tests/test_step09_trade_settlement.py
      - name: STEP 9 regional trade endurance and alternative customs routes
        run: python tests/test_step09_trade_endurance.py
