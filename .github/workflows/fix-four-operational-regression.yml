name: Review four operational fixes (not merged)
on:
  push:
    branches:
      - fix/four-operations-review-20261119
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  four-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: New end-to-end regression for all four issues
        run: python tests/test_fix_four_operational_issues.py
      - name: Previously reported zero-utilization and old-save regression
        run: |
          python tests/test_main_bom_factory_staffing.py
          python tests/test_main_support_factory_auto_restore.py
      - name: Existing supply, trade, sales and financial regression
        run: |
          python tests/test_v034_inventory_forecast.py
          python tests/test_v031_demand_allocation.py
          python tests/test_v029_trade.py
          python tests/test_v029_ai_investment.py
