<script>
'use strict';
/* One-file offline prototype v0.5. The selected build direction is B/B/B.
   Historical population anchor estimates are clearly separate from synthetic economy parameters.
   Ratified design is SPEC-001..094; questions 91..93 and SPEC-095+ remain unanswered. */
// Save format v1 is intentionally retained for compatibility with v0.1 exports.
const VERSION=1, AUTOKEY='conglomerate.autosave.',MANKEY='conglomerate.manual.',POINTER='conglomerate.auto.active';
const DB_NAME='CONGLOMERATE_LOCAL_V02', DB_VERSION=1;
let IDB=null, STORAGE_READY=false, SAVE_BUSY=false, MONTH_RUNNING=false;
const SAVE_INDEX={backend:'初期化中',active:null,previous:null,activeChecksum:null,previousChecksum:null,auto:[null,null,null],manual:[null,null,null],legacyImported:false};
// Approximate population anchors (millions); other economic variables remain synthetic.
// Based on the OWID long-run population series (Gapminder before 1950; UN WPP since 1950).
// Reference values are rounded and based on modern territorial boundaries, not historical sovereignty.
const POPULATION_ANCHORS={
 JP:{1900:43.8,1920:56.0,1950:83.6,1980:117.1,2020:126.6},
 US:{1900:76.3,1920:106.5,1950:157.8,1980:229.5,2020:339.1},
 UK:{1900:41.5,1920:43.7,1950:49.8,1980:56.3,2020:67.3},
 DE:{1900:56.4,1920:61.2,1950:68.4,1980:78.3,2020:83.6},
 FR:{1900:38.5,1920:39.0,1950:41.8,1980:53.9,2020:67.4}
};
const POP_SOURCE='https://ourworldindata.org/grapher/population';
function anchorPopulation(code,year){const anchors=POPULATION_ANCHORS[code];if(!anchors)return null;
 const yrs=Object.keys(anchors).map(Number).sort((a,b)=>a-b);
 if(year<=yrs[0])return anchors[yrs[0]];
 if(year>=yrs[yrs.length-1])return anchors[yrs[yrs.length-1]];
 for(let i=1;i<yrs.length;i++){if(year<=yrs[i]){const lo=yrs[i-1],hi=yrs[i];return anchors[lo]+(anchors[hi]-anchors[lo])*(year-lo)/(hi-lo);}}return null;}

const NAMES={JP:'日本',US:'アメリカ',UK:'イギリス',DE:'ドイツ',FR:'フランス'};
const COUNTRIES={
 JP:{currency:'JPY',fx:1,pop:44,wealth:1,wage:145,demand:115,steel:420,rubber:280,steelSupply:1100,rubberSupply:1050},
 US:{currency:'USD',fx:150,pop:78,wealth:1.22,wage:155,demand:250,steel:430,rubber:270,steelSupply:1700,rubberSupply:1650},
 UK:{currency:'GBP',fx:190,pop:42,wealth:1.12,wage:150,demand:135,steel:440,rubber:290,steelSupply:950,rubberSupply:930},
 DE:{currency:'DEM',fx:160,pop:55,wealth:1.10,wage:148,demand:145,steel:410,rubber:280,steelSupply:1000,rubberSupply:970},
 FR:{currency:'FRF',fx:155,pop:41,wealth:1.02,wage:147,demand:115,steel:425,rubber:290,steelSupply:900,rubberSupply:900}
};
const ACCTYPE={cash:'asset',materials:'asset',wip:'asset',goods:'asset',ppe:'asset',accdep:'contra',investment:'asset',ar:'asset',loanrec:'asset',resourceRights:'asset',payable:'liability',wagesDue:'liability',debt:'liability',interestDue:'liability',taxDue:'liability',capital:'equity',sales:'revenue',serviceRevenue:'revenue',otherRevenue:'revenue',cogs:'expense',labor:'expense',rndExpense:'expense',advert:'expense',maintenance:'expense',interestExpense:'expense',depreciation:'expense',taxExpense:'expense',fxLoss:'expense',otherExpense:'expense'};
const PAGES={dashboard:'経営概況',market:'市場・世界経済',product:'製品・開発',factory:'工場・調達',people:'研究・人事',finance:'財務・資金',group:'企業グループ',consolidated:'連結財務三表',reports:'月次レポート',save:'保存・設定'};
let S=null,PAGE='dashboard',VIEW_FIRM='',VIEW_COUNTRY='JP',wizard=0,setup={era:1900,country:'JP',history:'historical',difficulty:'normal',name:'東亜自動車工業'},monthlyPreview=false,saveWarning='';
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const cents=n=>Math.round(n*100);
const moneyLocal=(v,cur='JPY')=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2}).format((v||0)/100)+' '+cur;
const nfmt=n=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2}).format(n||0);
const fnum=(f,v)=>moneyLocal(v,COUNTRIES[f.country]?.currency||'JPY');
const baseMoney=v=>moneyLocal(v,'円相当');
const localFromBase=(base,code)=>cents(base/COUNTRIES[code].fx);
const baseFromLocal=(c,code)=>Math.round(c*COUNTRIES[code].fx);
const esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const dateKey=(s=S)=>`${s.year}年${s.month}月`;
const ym=(year,month)=>year*12+month-1;
const random=(s=S)=>{s.rng=(Math.imul(1664525,s.rng)+1013904223)>>>0;return s.rng/4294967296};
const rnd=(a,b,s=S)=>a+(b-a)*random(s);
const storageGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const hash=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')};
function company(id,s=S){return s.firms.find(f=>f.id===id)}
function current(){return company(VIEW_FIRM)||company(S?.playerId)}
function acc(f,name){return f.ledger[name]||0}
function post(f,dr,cr,desc,kind='operating',s=S){const d=Object.entries(dr).map(([a,n])=>[a,Math.round(n)]).filter(x=>x[1]), c=Object.entries(cr).map(([a,n])=>[a,Math.round(n)]).filter(x=>x[1]); const ds=d.reduce((a,b)=>a+b[1],0),cs=c.reduce((a,b)=>a+b[1],0); if(ds!==cs||ds<0||!Number.isSafeInteger(ds))throw Error('仕訳不一致: '+desc+' '+ds+'/'+cs);if(!ds)return;for(const [a,n] of d){if(!ACCTYPE[a])throw Error('勘定科目 '+a);f.ledger[a]=(f.ledger[a]||0)+n}for(const [a,n] of c){if(!ACCTYPE[a])throw Error('勘定科目 '+a);f.ledger[a]=(f.ledger[a]||0)-n} f.journals.push({id:s.seq++,when:ym(s.year,s.month),text:desc,kind,amount:ds,dr:d,cr:c,fxAtPost:s?.world?.[f.country]?.fx??COUNTRIES[f.country].fx});if(f.journals.length>10000)f.journals.splice(0,f.journals.length-10000)}
function financials(f){const a=f.ledger;let assets=0,liab=0,eq=0,rev=0,exp=0;for(const [k,t] of Object.entries(ACCTYPE)){let v=a[k]||0;if(t==='asset'||t==='contra')assets+=v; if(t==='liability')liab-=v;if(t==='equity')eq-=v;if(t==='revenue')rev-=v;if(t==='expense')exp+=v}return {assets,liab,capital:eq,revenue:rev,expenses:exp,profit:rev-exp, equity:eq+rev-exp,cash:acc(f,'cash'),debt:-acc(f,'debt'),bsDiff:assets-liab-eq-rev+exp};}
function netWorth(f){const x=financials(f);return x.equity}
function logNotice(text,level='info',s=S){s.notices.unshift({id:s.seq++,when:dateKey(s),text,level});if(s.notices.length>75)s.notices.pop()}
function initFirm(s,{name,country,industry='auto',player=false,strategy='growth',seedBase=1900000,size=1,publicOwnership=true}){
 const id='F'+s.seq++,fx=COUNTRIES[country].fx, f={id,name,country,industry,player,strategy,owners:publicOwnership?[{id:'PUBLIC',econ:1,vote:1}]:[],ledger:{},journals:[],payables:[],receivables:[],loans:[],stock:{steel:{q:0,v:0},rubber:{q:0,v:0}},goods:{},models:[],projects:[],rnd:{progress:0,target:'engine',budgetBase:12000},tech:1,plant:{capacity:Math.max(5,Math.round(45*size)),condition:92,assetCost:localFromBase(420000*size,country),construction:null},staff:{production:Math.max(7,Math.round(38*size)),research:Math.max(2,Math.round(5*size)),sales:Math.max(3,Math.round(10*size))},staffTarget:{},brand:{},dealers:{},adBudgets:{},plans:{},researchRights:['basic-engine'],distress:{stage:0,months:0},reserveUnits:4000,resourceStock:0,marketPresence:[country],monthly:{sales:0,cogs:0,profit:0,units:0,spent:0},history:[],auto:!player,contractPriority:'standard'};
 s.firms.push(f);post(f,{cash:localFromBase(seedBase,country)},{capital:localFromBase(seedBase,country)},'創業資本','financing',s);const factoryCost=f.plant.assetCost;post(f,{ppe:factoryCost},{cash:factoryCost},'事業設備・施設の取得','investing',s);f.brand[country]=35;f.dealers[country]=45;
 if(industry==='auto'||industry==='manufacturing'){
 const modelId='M'+s.seq++;f.models.push({id:modelId,name:industry==='auto'?'ツーリング 01':'標準製品',priceBase:7500,performance:58,quality:61,segment:'標準',status:'active',months:0});f.goods[modelId]={q:0,v:0};f.plans[modelId]=Math.round(f.plant.capacity*0.86);const steel= Math.round(95*size),rubber=Math.round(95*size),val=localFromBase(steel*COUNTRIES[country].steel+rubber*COUNTRIES[country].rubber,country);post(f,{materials:val},{cash:val},'創業時の実材料仕入','operating',s);f.stock.steel={q:steel,v:localFromBase(steel*COUNTRIES[country].steel,country)};f.stock.rubber={q:rubber,v:val-f.stock.steel.v};
 }else if(industry==='trade'){f.goods.TRADE={q:60,v:localFromBase(60*900,country)};post(f,{goods:f.goods.TRADE.v},{cash:f.goods.TRADE.v},'開業時の仕入商品','operating',s)}else if(industry==='resource'){const rights=localFromBase(80000,country);post(f,{resourceRights:rights},{cash:rights},'採取権取得','investing',s)}
 return f;
}
function blankWorld(year){const scale=year<1930?1:year<1960?1.55:year<1990?2.4:3.1;const result={};
 for(const [code,p] of Object.entries(COUNTRIES)){
  const pop=anchorPopulation(code,year)??p.pop*scale;
  const syntheticDemand=Math.round(p.demand*scale*scale*Math.pow(pop/(p.pop*scale),.45));
  result[code]={...p,code,fx:p.fx,pop,referencePopulation:pop,referencePopulationYear:year,wealth:p.wealth*(year<1960?1:1.3),demand:syntheticDemand,cycle:0,inflation:.02,rate:.04,confidence:.8,steelPrice:p.steel,rubberPrice:p.rubber,unemployment:.06,industrial:1,war:false};
 }return result}

function newGame(cfg){const era=Number(cfg.era),capitalBase=(era<1930?2400000:era<1960?4200000:era<1990?7000000:12000000)*(cfg.difficulty==='easy'?1.6:cfg.difficulty==='hard'?.7:1);
 const s={schema:VERSION,year:era,month:1,startYear:era,seq:1,rng:390182+(era*101),config:{...cfg},world:blankWorld(era),firms:[],playerId:'',history:[],notices:[],reports:[],lastReport:null,monthCommitted:ym(era,1)-1,autosaveState:'未保存',started:true,worldEffects:{},monthEvents:[]};

function groupLoan(){try{const parent=current(),id=inputValue('loanSubs'),child=company(id),base=intValue('loanAmount',10000,10000000);if(!canEdit(parent)||!child||!controller(S,child.id,parent.id)||parent.id===child.id)throw Error('支配下の別法人を指定してください');const amount=verifyMoney(parent,base);const recv=Math.round(amount*balanceFxRate(S,parent)/balanceFxRate(S,child));post(parent,{loanrec:amount},{cash:amount},'子会社への貸付','investing');const jParent=parent.journals.at(-1)?.id;post(child,{cash:recv},{debt:recv},'親会社からの借入','financing');const jChild=child.journals.at(-1)?.id;registerInterco(S,{kind:'loan',seller:parent.id,buyer:child.id,fromJournal:jParent,toJournal:jChild,yearMonth:ym(S.year,S.month),loanBase:baseFromLocal(amount,parent.country)});child.loans.push({id:'L'+S.seq++,outstanding:recv,rate:S.world[child.country].rate+.01,due:ym(S.year,S.month)+24,parent:parent.id,parentRemaining:amount,interestOutstanding:0,parentInterestRemaining:0});render();toast('会社間貸付を記録しました。単体財務に反映しました。')}catch(e){toast(e.message)}}

 `<div class="note warnbox" style="margin-bottom:15px"><b>会計上の範囲：</b>取得日帳簿残高を凍結し、取得価格差を追跡します。ただし、公正価値への配分・歴史通貨制度・同月中の厳密な損益日割りは未確定です。<b>帳簿価額基準の連結試算であり、監査済みの正式財務諸表ではありません。</b> 上段は従来の固定基準レートの比較表です。下段に全科目の期末スポット換算BSと取引時レートの月次PL（ともに試算）を追加しました。</div>
 <div class="kpis">${card('連結対象',g.members.length+'社','重複連結なし','')}${card('連結総資産',formatBase(b.assets),'投資相殺・未実現利益調整後','')}${card('親会社株主帰属純資産',formatBase(b.parentEquity),'非支配株主持分を除外','')}${card('非支配株主持分',formatBase(b.nci),'複数階層の経済持分から算出','')}</div>
 <div class="grid"><section class="panel span6"><h2>連結貸借対照表（BS）・現時点</h2>${resultRows([['現金',b.cash],['商品在庫（内部利益消去後）',b.goods],['取得差額（正ののれん）',b.goodwill],['総資産',b.assets,true],['負債',b.liab],['親会社株主帰属純資産',b.parentEquity],['非支配株主持分',b.nci],['負債＋純資産',b.liab+b.parentEquity+b.nci,true],['貸借照合差額',b.liabEquityDiff,true]])}</section>
 <section class="panel span6"><h2>連結損益計算書（PL）・取得後累計</h2>${resultRows([['外部売上・収益（内部売上消去後）',p.revenue],['費用・売上原価（内部調整後）',p.expenses],['帳簿価額基準の割安取得益（仮）',p.bargainGain],['連結当期までの累計損益',p.profit,true],['非支配株主帰属分',p.nciProfit],['親会社株主帰属分',p.parentProfit,true]])}<p class="footnote">取得以前の損益は取得元帳から判定可能な範囲で控除します。過去の取得時点・PPAが欠落する旧セーブでは精度が制限されます。</p></section>
 <section class="panel span6"><h2>連結キャッシュフロー（CF）・直近確定月</h2>${resultRows([['営業キャッシュフロー',c.operating],['投資キャッシュフロー',c.investing],['財務キャッシュフロー',c.financing],['外部との純キャッシュフロー',c.net,true],['前月末連結現金',c.openingCash??0],['当月末連結現金',c.closingCash,true],['取得した会社の現金（投資CF内訳）',c.scopeAdded],['換算差（非資金項目）',c.fxTranslation],['CF照合差額（端数含む）',c.unreconciled??0]])}<p class="footnote">直近確定月：${Math.floor(c.period/12)}年${c.period%12+1}月。${c.fromCommittedSnapshot?'月末の確定時点に保存したCF履歴を表示。':'当月の仕訳と取得範囲から計算。'} 為替換算差は営業・投資・財務CFに含めず別記。照合結果：${c.reconciled?'一致':'要確認'}。差額の許容値：${formatBase(c.roundingTolerance||0)}。未照合額は利益・CFに自動加算しません。</p></section>
 <section class="panel span6"><h2>連結調整・検算</h2>${resultRows([['親子会社の投資勘定消去',g.adjustments.investment],['内部貸付債権消去',g.adjustments.loanRecEliminated],['内部借入債務消去',g.adjustments.loanDebtEliminated],['帳簿価額ベースのれん（仮）',g.adjustments.goodwill],['内部売上消去',g.adjustments.internalSales],['内部在庫未実現利益消去',g.adjustments.inventoryProfit],['未収利息消去',g.adjustments.interestRecEliminated],['未払利息消去',g.adjustments.interestDueEliminated],['内部金利収益消去',g.adjustments.interestRev],['内部金利費用消去',g.adjustments.interestExp]])}<div class="sep"></div>${g.errors.length?g.errors.map(x=>`<div class="notice">${tag('異常','bad')} ${esc(x)}</div>`).join(''):tag('構造・貸借の検算通過','good')}${g.notes.map(x=>`<p class="small muted">・${esc(x)}</p>`).join('')}</section>
 <section class="panel span6"><h2>全科目・期末為替換算BS（v0.5試算）</h2>${resultRows([['現金（期末スポット）',g.spot.cash],['連結総資産（期末レート）',g.spot.assets,true],['連結負債（期末レート）',g.spot.liabilities],['親会社帰属純資産（暫定）',g.spot.parentEquity],['非支配株主持分（暫定）',g.spot.nci],['負債＋純資産',g.spot.liabilities+g.spot.parentEquity+g.spot.nci,true],['期末換算BS差額',g.spot.checkDifference],['固定参照レートとの総資産差',g.spot.fxVsReference.assets]])}<p class="footnote">資産・負債は各法人の決算時点スポットレートで一括換算。取得原価は親会社通貨の帳簿残高、暫定のれんは取得先通貨で換算。資本の歴史的レート換算と為替換算調整勘定（OCI）は未実装のため、正式連結BSではありません。</p></section>
 <section class="panel span6"><h2>直近確定月・取引時為替換算PL（v0.5試算）</h2>${resultRows([['外部収益（内部消去後）',g.periodPL.revenue],['費用（内部消去・棚卸調整後）',g.periodPL.expenses],['帳簿価額基準の割安取得益（仮）',g.periodPL.acquisitionDiscountGainProvisional],['当月連結損益',g.periodPL.profit,true],['非支配株主帰属損益（暫定）',g.periodPL.nciProfit],['親会社帰属損益（暫定）',g.periodPL.parentProfit,true],['当月の内部売上消去',g.periodPL.internalSalesEliminated],['内部棚卸利益の増減',g.periodPL.inventoryDeferralChange]])}<p class="footnote">${Math.floor(g.periodPL.period/12)}年${g.periodPL.period%12+1}月の仕訳を認識時レートで換算し、取得以前の損益を除外。当月確定時点のPLを保持し、その後の取得などで過去月を再計算しません。期中の取得時配賦と非支配損益の複雑な帰属は暫定です。</p></section>
 ${g.spotWarnings.map(x=>`<div class="panel span12 footnote">${esc(x)}</div>`).join('')}
 <section class="panel span12"><h2>外貨換算・取得時点の検証明細（試算）</h2><p class="small muted">換算対象は各法人の実現金残高。取引ごとに認識時のレート、BS期末に各地域の変動スポットレートを使用し、固定基準レートとの差を参考表示します。歴史為替制度・その他包括利益／換算調整勘定は正式未実装です。</p><div class="scroll"><table><thead><tr><th>法人</th><th>通貨</th><th class="num">期末レート（円/現地通貨）</th><th class="num">固定基準レート</th><th class="num">期末現金（スポット円相当）</th></tr></thead><tbody>${g.fxBalance.items.map(x=>`<tr><td>${esc(x.firm)}</td><td>${esc(x.currency)}</td><td class="num">${x.closingRate.toFixed(4)}</td><td class="num">${x.referenceRate.toFixed(4)}</td><td class="num">${formatBase(x.cashSpot)}</td></tr>`).join('')}</tbody></table></div>${rowstat('連結期末現金（スポット円相当）',formatBase(g.fxBalance.cash))}${rowstat('固定基準レートとの差',formatBase(g.fxBalance.deltaCash))}</section> <section class="panel span12"><h2>支配・持分帰属と取得台帳</h2><div class="scroll"><table><thead><tr><th>法人</th><th>議決権・支配</th><th class="num">親会社最終経済持分</th><th class="num">外部帰属比率</th></tr></thead><tbody>${g.members.map(id=>{const f=company(id),v=g.shares[id]||0;return `<tr><td>${esc(f.name)}</td><td>${id===S.playerId?'親会社':tag('連結対象','good')}</td><td class="num">${(v*100).toFixed(2)}%</td><td class="num">${((1-v)*100).toFixed(2)}%</td></tr>`}).join('')}</tbody></table></div><div class="scroll" style="margin-top:12px"><table><thead><tr><th>出資・取得元</th><th>取得対象</th><th>方式</th><th class="num">取得持分</th><th class="num">帳簿価額基準の取得差額</th><th>取得時レート・評価根拠</th></tr></thead><tbody>${g.links.map(l=>`<tr><td>${esc(l.parent)}</td><td>${esc(l.child)}</td><td>${l.kind==='foundation'?'子会社設立':'株式取得'}</td><td class="num">${(l.ratio*100).toFixed(1)}%</td><td class="num">${formatBase(l.residual)}</td><td class="small">${esc(g.acquisitionAudit.find(a=>a.parent===l.parent&&a.child===l.child)?.recognition||'旧版推定')} / ${g.acquisitionAudit.find(a=>a.parent===l.parent&&a.child===l.child)?.targetFxOnAcq??'不明'}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">取得台帳の対象取引はありません</td></tr>'}</tbody></table></div></section>
 </div>`;
}

function finTable(f){const x=financials(f);return `<div class="scroll"><table><thead><tr><th>単体貸借対照表（累計）</th><th class="num">現地通貨</th></tr></thead><tbody>${[['現金',acc(f,'cash')],['材料在庫',acc(f,'materials')],['仕掛品',acc(f,'wip')],['完成品・商品在庫',acc(f,'goods')],['事業設備（純額）',acc(f,'ppe')+acc(f,'accdep')],['投資有価証券・子会社株式',acc(f,'investment')],['売掛金・貸付金',acc(f,'ar')+acc(f,'loanrec')],['採取権',acc(f,'resourceRights')],['資産合計',x.assets],['負債合計',x.liab],['払込資本',x.capital],['累計損益',x.profit],['負債＋純資産',x.liab+x.equity]].map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${fnum(f,v)}</td></tr>`).join('')}</tbody></table></div>`}
function financePage(){const f=current(),edit=canEdit(f),x=financials(f),w=S.world[f.country];const recent=f.journals.slice(-28).reverse();return titlePage('財務・資金','法人別の取引別複式記録、単体財務、現金・借入を管理します。',tag('発生主義／資金決済を分離'))+(!edit?noaccess():'')+`<div class="grid">${card('単体総資産',fnum(f,x.assets),'評価額の合計','span3')}${card('現金残高',fnum(f,x.cash),'現地通貨','span3')}${card('借入残高',fnum(f,x.debt),'現地通貨','span3')}${card('累計損益',`<span class="${x.profit>=0?'positive':'negative'}">${fnum(f,x.profit)}</span>`,'創業以来の累計','span3')}
 <section class="panel span6"><h2>法人別財務三表の基礎</h2>${finTable(f)}<div class="note" style="margin-top:12px">BS照合差額：${fnum(f,x.bsDiff)}（最小通貨単位）。取引別の借貸一致と在庫原価も自動検算します。連結用の調整は「連結財務三表」画面で確認できます。取得時公正価値など未確定部分は仮計算です。</div></section>
 <section class="panel span6"><h2>借入・資金繰り</h2>${rowstat('現金',fnum(f,x.cash))}${rowstat('借入残高',fnum(f,x.debt))}${rowstat('未払金',fnum(f,-acc(f,'payable')))}${rowstat('未払給与',fnum(f,-acc(f,'wagesDue')))}${rowstat('法人税未払',fnum(f,-acc(f,'taxDue')))}${rowstat('市場金利（仮）',(w.rate*100).toFixed(2)+'%')}${rowstat('新規借入金利（仮）',((w.rate+.03)*100).toFixed(2)+'%')}<div class="formgrid" style="margin-top:17px"><div class="field"><label for="borrowBase">借入金額（円相当）</label><input type="number" id="borrowBase" min="50000" max="50000000" value="100000" ${edit?'':'disabled'}></div><button class="btn primary" data-action="borrow" ${edit?'':'disabled'}>銀行借入（36か月）</button></div><div class="sep"></div><h3>既存借入</h3>${f.loans.length?f.loans.map(l=>`<div class="itemstat"><span>残元本 ${fnum(f,l.outstanding)}</span><span class="muted">年率${(l.rate*100).toFixed(1)}%</span></div>`).join(''):'<div class="muted small">借入契約なし</div>'}<div class="footnote">借入・利息は実取引として仕訳に反映します。債権者別の再建交渉と詳細な税務処理は未実装です。</div></section>
 <section class="panel span12"><h2>最新の取引別複式仕訳</h2><div class="scroll"><table><thead><tr><th>年月</th><th>取引内容</th><th>借方</th><th>貸方</th><th class="num">金額</th></tr></thead><tbody>${recent.map(j=>`<tr><td>${Math.floor(j.when/12)}年${j.when%12+1}月</td><td>${esc(j.text)}</td><td>${esc(j.dr.map(([k,v])=>k).join(' / '))}</td><td>${esc(j.cr.map(([k,v])=>k).join(' / '))}</td><td class="num">${fnum(f,j.amount)}</td></tr>`).join('')}</tbody></table></div></section></div>`}
function groupPage(){const f=current(),edit=canEdit(f),grp=controlled(),candidates=S.firms.filter(x=>!controller(S,x.id)&&!x.owners.some(o=>o.id!=='PUBLIC'));const sum=grp.reduce((t,x)=>{const n=financials(x);return {assets:t.assets+baseFromLocal(n.assets,x.country),sales:t.sales+baseFromLocal(x.monthly.sales,x.country),cash:t.cash+baseFromLocal(n.cash,x.country),liab:t.liab+baseFromLocal(n.liab,x.country)}},{assets:0,sales:0,cash:0,liab:0});return titlePage('企業グループ・M&A','独立法人・株式所有・事業拡大・会社間資金移転を管理します。',`<button class="btn primary" data-page="consolidated">連結財務三表を表示 ▸</button>`)+(!edit?noaccess():'')+`<div class="note" style="margin-bottom:16px"><b>集計の区別：</b> 下記の主要カードは法人単体合算の参考値です。取得・持分・内部取引を調整した連結BS・PL・CFは「連結財務三表」画面で確認できます。取得時公正価値配分などはまだ試作評価です。</div>
 <div class="kpis">${card('支配下の法人',grp.length+' 社','議決権過半数の連鎖','')}${card('単体現金の合算',baseMoney(sum.cash),'法人間で現金は自動融通されません','')}${card('単体資産の合算',baseMoney(sum.assets),'内部調整前・正式連結値ではない','')}${card('前月売上の合算',baseMoney(sum.sales),'内部消去前・正式連結値ではない','')}</div>
 <div class="grid"><section class="panel span7"><h2>会社と直接保有株主</h2><div class="scroll"><table><thead><tr><th>法人</th><th>国・業態</th><th>株主・持分</th><th>状態</th></tr></thead><tbody>${S.firms.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${NAMES[x.country]} / ${industryName(x.industry)}</td><td>${x.owners.map(o=>esc(o.id==='PUBLIC'?'外部株主':(company(o.id)?.name||'不明'))+' '+Math.round(o.econ*100)+'%').join(' / ')}</td><td>${controller(S,x.id)?tag('支配下','good'):tag('独立')}</td></tr>`).join('')}</tbody></table></div></section>
 <section class="panel span5"><h2>株式取得（試作操作）</h2><p class="small muted">外部株主所有の企業について60%株式を取得します。取得対象の現金・負債はその会社に残ります。</p>${candidates.map(x=>{const costBase=Math.max(180000,Math.round(baseFromLocal(netWorth(x),x.country)/100*.65));return `<div class="vitem"><div class="row between"><strong>${esc(x.name)}</strong>${tag(industryName(x.industry))}</div><div class="small muted">${NAMES[x.country]} / 60% 取得参考価格：${baseMoney(cents(costBase))}</div><div style="margin-top:8px"><button class="btn sm" data-action="acquire" data-id="${esc(x.id)}" ${edit?'':'disabled'}>60%株式を取得する</button></div></div>`}).join('')||'<div class="muted">現在の買収候補はありません。</div>'}<div class="footnote">取得価額と帳簿価額を用いる連結調整は連結財務三表に表示します。公正価値を用いる正式な取得対価配分は未確定です。</div></section>
 <section class="panel span7"><h2>子会社・新規事業の設立</h2><p class="small muted">資本金は設立元法人の現金から実際に移転し、新会社が事業用設備・必要在庫を購入します。</p><div class="formgrid"><div class="field"><label for="subName">新会社名</label><input id="subName" maxlength="38" placeholder="例：東亜エネルギー" ${edit?'':'disabled'}></div><div class="field"><label for="subCountry">創業国</label><select id="subCountry" ${edit?'':'disabled'}>${Object.keys(S.world).map(c=>`<option value="${c}" ${f.country===c?'selected':''}>${NAMES[c]}</option>`).join('')}</select></div><div class="field"><label for="subIndustry">業態</label><select id="subIndustry" ${edit?'':'disabled'}><option value="manufacturing">製造業</option><option value="resource">資源業</option><option value="trade">商業・流通</option><option value="service">サービス業</option></select></div><div class="field"><label for="subCapital">払込資本金（円相当）</label><input type="number" id="subCapital" value="600000" min="450000" max="20000000" ${edit?'':'disabled'}></div><button class="btn primary" data-action="createSub" ${edit?'':'disabled'}>子会社を設立</button></div></section>
 <section class="panel span5"><h2>グループ内貸付</h2><p class="small muted">親会社の現金を減少させ、子会社の現金・債務を増加させます。</p><div class="formgrid"><div class="field"><label for="loanSubs">借り手の子会社</label><select id="loanSubs" ${edit?'':'disabled'}>${S.firms.filter(x=>x.id!==f.id&&controller(S,x.id,f.id)).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')||'<option value="">対象なし</option>'}</select></div><div class="field"><label for="loanAmount">貸付金額（円相当）</label><input id="loanAmount" type="number" value="100000" min="10000" ${edit?'':'disabled'}></div><button class="btn" data-action="groupLoan" ${edit?'':'disabled'}>貸付を実行</button></div><div class="footnote">会社間貸付は両社の単体会計に記録され、連結財務三表では内部債権債務・利息を調整します。</div></section>
 <section class="panel span12"><h2>グループ内商品売買・未実現利益テスト</h2><p class="small muted">選択中の法人の実在する完成品を、支配下の商業子会社へ現金決済で移転します。両社の単体売買を残し、連結では内部売上と売れ残り在庫の未実現利益を消去します。買い手の現金・売り手の在庫を確認してください。</p><div class="formgrid"><div class="field"><label>移転商品</label><select id="internalProduct">${Object.entries(f.goods).filter(([k,v])=>v.q>0&&!k.startsWith('IT')).map(([k,v])=>`<option value="${esc(k)}">${esc(f.models.find(m=>m.id===k)?.name||k)}（${v.q}個）</option>`).join('')||'<option value="">在庫なし</option>'}</select></div><div class="field"><label>購入側（支配下商業子会社）</label><select id="internalBuyer">${S.firms.filter(x=>x.industry==='trade'&&x.id!==f.id&&controller(S,x.id)).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')||'<option value="">対象なし</option>'}</select></div><div class="field"><label>移転数量</label><input id="internalQuantity" type="number" min="1" max="100000" value="1"></div><button class="btn primary" data-action="groupSale" ${edit?'':'disabled'}>実物売買・連結調整</button></div><p class="footnote">移転価格は帳簿原価に20%を加算する試作方式です。製品移転価格の正式係数は未確定です。買い手が商業子会社の場合のみ対応しています。</p></section></div>`}
function reportsPage(){const rep=S.lastReport;const f=current();return titlePage('月次レポート','月末一括処理の結果・資源・財務の整合性を確認します。',`<button class="btn primary" data-action="previewMonth">次の月末処理 ▸</button>`)+(rep?`<div class="kpis">${card('確定年月',esc(rep.date),'処理は一回だけ確定','')}${card('親会社現金',fnum(company(S.playerId),rep.cash),'確定時点','')}${card('親会社当月損益',`<span class="${rep.netProfit>=0?'positive':'negative'}">${fnum(company(S.playerId),rep.netProfit)}</span>`,'当月発生の損益','')}${card('親会社販売',nfmt(rep.units)+'件','完成車・商品・サービス等','')}</div><div class="grid"><section class="panel span6"><h2>月次運用サマリー</h2>${rowstat('月次売上',fnum(company(S.playerId),rep.sales))}${rowstat('完成生産数量',nfmt(rep.produced))}${rowstat('支配下の法人',rep.firms+'社')}${rowstat('会計・資源検算',tag('合格','good'))}${rowstat('自動保存',S.autosaveState==='保存成功'?tag('成功','good'):tag(S.autosaveState,'warn'))}</section><section class="panel span6"><h2>今回の出来事</h2>${rep.events.length?rep.events.map(x=>`<div class="notice">${esc(x)}</div>`).join(''):'<div class="muted small">重要な特殊イベントはありませんでした。</div>'}</section><section class="panel span12"><h2>月次レポート履歴</h2><div class="scroll"><table><thead><tr><th>年月</th><th class="num">月間売上</th><th class="num">月間損益</th><th class="num">販売件数</th><th class="num">生産数量</th></tr></thead><tbody>${S.reports.map(r=>`<tr><td>${esc(r.date)}</td><td class="num">${fnum(company(S.playerId),r.sales)}</td><td class="num ${r.netProfit>=0?'positive':'negative'}">${fnum(company(S.playerId),r.netProfit)}</td><td class="num">${nfmt(r.units)}</td><td class="num">${nfmt(r.produced)}</td></tr>`).join('')}</tbody></table></div></section></div>`:`<section class="panel"><h2>月次計算はまだ実行されていません</h2><p>製品・工場・研究・人事などの計画を設定し、右上の「月末処理」を選択してください。</p><button class="btn primary" data-action="previewMonth">初回月末処理を確認する</button></section>`)}

async function diagnoseStorage(){
 if(!IDB){toast('保存診断：IndexedDB未使用。ローカル起動方法を確認してください');return;}
 if(SAVE_BUSY||MONTH_RUNNING){toast('月次処理・保存が完了してから診断してください');return;}
 const key='diagnostic:v04:'+String(Date.now()),value='conglomerate-v04-'+Math.random().toString(36).slice(2);
 const rec={key,serialized:value,savedAt:new Date().toISOString()},results=[];
 const remove=async()=>new Promise((resolve,reject)=>{
  const tx=IDB.transaction('snapshots','readwrite');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
  tx.objectStore('snapshots').delete(key);
 });
 try{
  // The diagnostic writes only an isolated key; never change the save-slot pointer.
  await idbWrite('snapshots',rec);results.push('独立キー書込成功');
  const got=await idbRead('snapshots',key);
  if(got?.serialized!==value)throw Error('読戻し不一致');results.push('読戻し一致');
  IDB.close();IDB=await openDatabase();
  const reopened=await idbRead('snapshots',key);
  if(reopened?.serialized!==value)throw Error('DB再接続後の内容不一致');results.push('接続終了・再開後も一致');
  await remove();const removed=await idbRead('snapshots',key);
  if(removed)throw Error('テストデータを削除できません');results.push('隔離データ削除成功');
  saveWarning='保存診断：'+results.join('、')+'。ページ再読込・端末終了時の保護まで保証する試験ではありません。';
  toast('IndexedDB実機診断合格：読書・再接続・削除');
 }catch(e){saveWarning='保存診断失敗：'+e.message;toast(saveWarning);
  try{if(IDB){const x=await idbRead('snapshots',key);if(x)await remove();}}catch(_){}}
 finally{try{await refreshSaveIndex();}catch(e){console.warn(e)}render();}
}

function savePage(){const active=SAVE_INDEX.active,gen=SAVE_INDEX.auto.map(inspectRecord);return titlePage('保存・設定','大容量IndexedDB・保護世代・外部JSONバックアップを利用できます。',tag('オフライン保存'))+`<div class="grid"><section class="panel span7"><h2>手動セーブ（3スロット）</h2>${[0,1,2].map(i=>{const x=inspectRecord(SAVE_INDEX.manual[i]);return `<div class="savebox"><div class="grow"><b>手動保存 ${i+1}</b><div class="small muted">${!x?'空きスロット':x.error?'読込不能：'+esc(x.error):esc(x.date)+' / '+esc(x.name)}</div></div><button class="btn sm" data-action="saveManual" data-slot="${i}">保存</button><button class="btn sm" data-action="loadManual" data-slot="${i}" ${x&&!x.error?'':'disabled'}>読込</button></div>`}).join('')}<h2 style="margin-top:22px">自動保存・保護世代</h2>${gen.map((x,i)=>`<div class="savebox"><div class="grow"><b>自動保存世代 ${i+1}</b> ${active===i?tag('有効世代','good'):SAVE_INDEX.previous===i?tag('保護済み前世代'):tag('書込候補')}<div class="small muted">${!x?'未保存':x.error?'検証失敗：'+esc(x.error):esc(x.date)+' / '+esc(x.name)}</div></div><button class="btn sm" data-action="loadAutoSlot" data-slot="${i}" ${x&&!x.error?'':'disabled'}>読込</button></div>`).join('')}<p class="footnote">IndexedDBに3領域（有効世代・前回確定世代・書込候補）を設け、旧2世代を保持したまま候補を書込・検証し、成功後に参照を切り替えます。失敗時の未確定候補は復元対象にしません。</p></section>
 <section class="panel span5"><h2>バックアップと新しいゲーム</h2><div class="vlist"><button class="btn" data-action="diagnoseStorage">IndexedDB実機診断（既存セーブ非変更）</button><button class="btn primary" data-action="export">現在の状態をJSONで書き出す</button><button class="btn" data-action="import">JSONバックアップを読み込む</button><button class="btn danger" data-action="newGame">新しいゲームを開始する</button></div><div class="sep"></div><h3>現在の保存状態</h3>${rowstat('保存バックエンド',tag(SAVE_INDEX.backend,SAVE_INDEX.backend==='IndexedDB'?'good':'warn'))}${rowstat('計算状態',S.monthCommitted===ym(S.year,S.month)?'当月確定済み':'次月実行待ち')}${rowstat('自動保存',S.autosaveState==='保存成功'?tag('成功','good'):tag(S.autosaveState,'warn'))}${rowstat('検算',check(S).length?tag('異常','bad'):tag('合格','good'))}${SAVE_INDEX.legacyImported?`<div class="note">旧版v0.1から保存データをコピーしました。旧キーは保持しています。</div>`:''}${saveWarning?`<div class="note warnbox">${esc(saveWarning)}</div>`:''}<div class="sep"></div><h3>保存の限界</h3><p class="small muted">IndexedDBもブラウザ・端末内の保存です。ブラウザデータ削除や端末故障には対応できません。重要なセーブはJSONを別の場所へ保管してください。</p><p class="small muted">読み込んだJSONはその場のゲーム状態として検証します。保存枠に残すには手動セーブしてください。</p></section><section class="panel span12"><h2>史実基準データと対応機能</h2><div class="scroll"><table><thead><tr><th>機能</th><th>現段階</th><th>正式仕様との関係</th></tr></thead><tbody>${[['創業シナリオ・歴史モード・国','試作動作','歴史的国境・通貨制度の正確な再現は未完成'],['主要国の開始年人口基準値','参考統計を導入','推計人口の概数を内蔵。経済・需要・金融の係数は仮'],['自動車生産・販売・在庫・原価','試作動作','工程別仕掛品・取引詳細は一部未完成'],['国別市場・原材料調達・競合AI','試作動作','市場価格・契約割当・政策係数は仮'],['研究・設備・人員・標準借入','試作動作','労使交渉・設備保守の詳細は未実装'],['業態別子会社設立・株式取得','試作動作','高度な権限審査・M&A評価は未完成'],['連結三表・非支配株主持分・内部消去','試作動作','取得時帳簿スナップショット、確定月CF履歴、変動レートの換算ブリッジを追加。正式PPA・歴史通貨制度は未確定'],['IndexedDB・保護2世代＋候補・手動3枠・JSON','試作動作','端末データ消失は外部バックアップで備える'],['長期性能と正式数式の受入試験','未完了','正式な定量係数・性能基準は未決定']].map(([a,b,c])=>`<tr><td>${a}</td><td>${tag(b,b==='未実装'||b==='未完了'?'warn':'good')}</td><td>${c}</td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:13px">人口基準値：<a href="${POP_SOURCE}" target="_blank" rel="noopener">Our World in Data / Gapminder / UN WPP</a> を参照した歴史推計の概数（2020年以前）。現在の国境に合わせた統計であり、1900年当時の国家領域を再現するものではありません。ゲーム実行中に外部データを取得しません。</div></section></div>`}
function render(){if(!S){document.getElementById('content').innerHTML='';document.getElementById('modalHost').innerHTML=wizardHTML();document.getElementById('topCompany').textContent='ゲーム未開始';document.getElementById('topDate').textContent='開始シナリオを選択';document.getElementById('companySelect').innerHTML='';document.getElementById('regionSelect').innerHTML='';return}if(!current())VIEW_FIRM=S.playerId;const f=current();document.getElementById('topCompany').textContent=f.name;document.getElementById('topDate').textContent=`${dateKey()} ｜ ${NAMES[f.country]} ｜ ${industryName(f.industry)}`;document.getElementById('companySelect').innerHTML=S.firms.map(x=>`<option value="${esc(x.id)}" ${VIEW_FIRM===x.id?'selected':''}>${esc(x.name)}${controller(S,x.id)?'':' (参照)'}</option>`).join('');document.getElementById('regionSelect').innerHTML=Object.keys(S.world).map(c=>`<option value="${c}" ${VIEW_COUNTRY===c?'selected':''}>${NAMES[c]}</option>`).join('');document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===PAGE));const html={dashboard:dashboard,market:marketPage,product:productPage,factory:factoryPage,people:peoplePage,finance:financePage,group:groupPage,consolidated:consolidatedPage,reports:reportsPage,save:savePage}[PAGE];document.getElementById('content').innerHTML=html();document.getElementById('modalHost').innerHTML=monthlyPreview?monthModal():'';document.getElementById('nextMonthBtn').disabled=S.monthCommitted===ym(S.year,S.month)}
function monthModal(){const issues=checkMonthPreview(),f=current();return `<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true"><div class="eyebrow">MONTH-END / PRE-FLIGHT</div><h1>${dateKey()}の月末処理</h1><p class="muted">処理前チェックは確定状態を変更しません。実行後は当月を固定順序で計算し、資源・会計の整合性を検証して結果を確定します。</p><div class="grid">${card('対象',esc(dateKey()),'月次一括処理','span4')}${card('支配下法人',controlled().length+'社','計算は全世界の企業を含む','span4')}${card('現金残高',fnum(f,financials(f).cash),'現在選択中の法人','span4')}</div><h2 style="margin-top:20px">事前確認・警告</h2>${issues.length?issues.map(v=>`<div class="notice">${tag('注意','warn')}　${esc(v)}</div>`).join(''):`<div class="note">現時点の計画に重大な資源警告は見つかりませんでした。価格変化や供給不足など、実際の月末処理で決定される結果もあります。</div>`}<div class="note warnbox" style="margin-top:15px">数値計算は試作係数に基づきます。正式SPEC-095以降の計算方式は未確定です。処理失敗時は計算前の状態を保護します。</div><div class="footer"><button class="btn" data-action="cancelMonth">計画に戻る</button><button class="btn primary" data-action="runMonth">この月を確定する</button></div></div></div>`}
function wizardHTML(){const stepLabels=['開始年代','創業国','モードと難易度','創業条件確認'];return `<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true"><div class="eyebrow">NEW GAME / STEP ${wizard+1} OF 4</div><h1>新しい企業経営を始める</h1><p class="muted small">自動車メーカーを創業する試作版です。人口は史実推計の基準値、その他の経済係数は仮設定です。</p><div class="steps">${stepLabels.map((x,i)=>`<span class="${i<=wizard?'on':''}" title="${x}"></span>`).join('')}</div>${wizard===0?`<h2>1. 開始年代</h2><div class="choices">${[1900,1920,1950,1980,2020].map(y=>`<label class="choice"><input type="radio" name="era" value="${y}" ${setup.era===y?'checked':''}><b>${y}年</b><span class="small muted">${y===1900?'工業化初期・自動車市場の草創期':y===1920?'自動車普及期':y===1950?'戦後産業復興期':y===1980?'世界市場拡大期':'現代のグローバル市場'}</span></label>`).join('')}</div>`:wizard===1?`<h2>2. 創業国</h2><div class="choices">${Object.keys(NAMES).map(c=>`<label class="choice"><input type="radio" name="country" value="${c}" ${setup.country===c?'checked':''}><b>${NAMES[c]}</b><span class="small muted">試作通貨：${COUNTRIES[c].currency} / 人口基準値 ${nfmt(anchorPopulation(c,setup.era))}百万人</span></label>`).join('')}</div>`:wizard===2?`<h2>3. 歴史モードと難易度</h2><div class="formgrid"><div class="field"><label>歴史モード</label><select id="wizardHistory"><option value="historical" ${setup.history==='historical'?'selected':''}>史実モード</option><option value="alternate" ${setup.history==='alternate'?'selected':''}>仮想歴史モード</option></select></div><div class="field"><label>難易度</label><select id="wizardDifficulty"><option value="easy" ${setup.difficulty==='easy'?'selected':''}>易しい（資本1.6倍）</option><option value="normal" ${setup.difficulty==='normal'?'selected':''}>標準</option><option value="hard" ${setup.difficulty==='hard'?'selected':''}>難しい（資本0.7倍）</option></select></div><div class="field"><label>会社名</label><input id="wizardName" maxlength="38" value="${esc(setup.name)}"></div></div><div class="note" style="margin-top:20px">史実モードは主要な歴史イベントを扱い、景気循環は固定日付では発生しません。現段階ではイベントや歴史的国境・通貨の厳密再現は未完成です。</div>`:`<h2>4. 創業条件の確認</h2><div class="statrow">${[['会社名',esc(setup.name)],['開始年月',setup.era+'年1月'],['創業国',NAMES[setup.country]],['歴史モード',setup.history==='historical'?'史実':'仮想'],['難易度',setup.difficulty==='easy'?'易しい':setup.difficulty==='hard'?'難しい':'標準'],['初期資本（円相当）',nfmt((setup.era<1930?2400000:setup.era<1960?4200000:setup.era<1990?7000000:12000000)*(setup.difficulty==='easy'?1.6:setup.difficulty==='hard'?.7:1))]].map(([k,v])=>`<div><div class="label">${k}</div><strong>${v}</strong></div>`).join('')}</div><div class="note warnbox" style="margin-top:20px">人口は史実推計の概数を基準値に採用（${nfmt(anchorPopulation(setup.country,setup.era))}百万人）。現在の国境に対応した人口推計であり、当時の国境・通貨を再現するものではありません。為替・価格・需要は試作値です。</div>`}<div class="footer"><button class="btn" data-action="wizardBack" ${wizard===0?'disabled':''}>戻る</button><button class="btn primary" data-action="wizardNext">${wizard===3?'この条件で創業する':'次へ進む ▸'}</button></div></div></div>`}
async function wizardNext(){if(S)return;if(wizard===0)setup.era=Number(document.querySelector('input[name="era"]:checked')?.value||1900);if(wizard===1)setup.country=document.querySelector('input[name="country"]:checked')?.value||'JP';if(wizard===2){setup.history=inputValue('wizardHistory')||'historical';setup.difficulty=inputValue('wizardDifficulty')||'normal';setup.name=(inputValue('wizardName')||'').trim().slice(0,38)||'新規自動車メーカー'}if(wizard<3){wizard++;render();return}try{S=newGame(setup);VIEW_FIRM=S.playerId;VIEW_COUNTRY=setup.country;PAGE='dashboard';render();const saved=await saveAuto();render();toast(saved?'創業しました。IndexedDBに自動保存しました。':'創業しましたが、自動保存に失敗しました。JSONバックアップを保存してください。')}catch(e){S=null;toast('創業設定エラー：'+e.message);console.error(e)}}
function actions(action,elem){if(MONTH_RUNNING){toast('月次処理中です。保存・計算の確定を進めています。');return;}if(action==='wizardNext')return wizardNext();if(action==='wizardBack'){wizard=Math.max(0,wizard-1);return render()}if(!S)return;switch(action){case 'previewMonth':monthlyPreview=true;return render();case 'cancelMonth':monthlyPreview=false;return render();case 'runMonth':return runMonth();case 'setPlan':return setPlan();case 'changeBudget':return changeBudget();case 'hireStaff':return hireStaff();case 'maintain':return maintain();case 'expand':return expand();case 'develop':return develop();case 'borrow':return borrow();case 'spendAd':return spendAd();case 'createSub':return createSub();case 'acquire':return acquire(elem.dataset.id);case 'groupLoan':return groupLoan();case 'groupSale':return groupSale();case 'diagnoseStorage':return diagnoseStorage();case 'saveManual':return saveManual(Number(elem.dataset.slot));case 'loadManual':{const i=Number(elem.dataset.slot);if(confirm('現在の未保存変更を破棄し、手動保存'+(i+1)+'を読み込みますか？'))return restore(SAVE_INDEX.manual[i]?.serialized);return}case 'loadAutoSlot':{const i=Number(elem.dataset.slot);if(confirm('自動保存世代'+(i+1)+'を読み込みますか？'))return restore(SAVE_INDEX.auto[i]?.serialized);return}case 'export':try{fileDownload(`conglomerate_${S.year}_${S.month}.json`,savePayload(S));toast('JSONバックアップを書き出しました')}catch(e){toast('書き出しに失敗：'+e.message)}return;case 'import':document.getElementById('importFile').click();return;case 'newGame':if(confirm('現在のセッションを終了し、新しいゲームを開始しますか？ 保存済みデータは削除しません。')){S=null;wizard=0;monthlyPreview=false;PAGE='dashboard';render()}return;}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav&&S){PAGE=nav.dataset.page;monthlyPreview=false;render();window.scrollTo({top:0,behavior:'instant'});return}const el=e.target.closest('[data-action]');if(el&&!el.disabled)actions(el.dataset.action,el)});
document.getElementById('companySelect').addEventListener('change',e=>{VIEW_FIRM=e.target.value;render()});document.getElementById('regionSelect').addEventListener('change',e=>{VIEW_COUNTRY=e.target.value;render()});document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const raw=await file.text();if(confirm('読み込み中のゲーム状態をJSONバックアップで置き換えますか？'))restore(raw)}catch(err){toast('ファイルを読み込めません：'+err.message)}e.target.value=''});
boot();
