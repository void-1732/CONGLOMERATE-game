/* v0.15 - nonlinear 800-node research tree, specialization and cross-field dependency graph */
.tech-family-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.tech-family-tabs button{display:grid;gap:3px;text-align:left;padding:12px;min-height:57px}
.tech-family-tabs button small{font-size:10px;opacity:.79;font-weight:400}
.tech-domain-tabs{gap:6px;margin:8px 0 5px;flex-wrap:nowrap;overflow:auto}
.tech-domain-tabs button{flex:1;white-space:normal;min-width:112px;line-height:1.4}
.tech-workspace{grid-template-columns:minmax(0,1fr) 316px}
.tech-board{height:min(670px,73vh);scroll-behavior:auto;background:#f5f8fc}
.tech-canvas{background:repeating-linear-gradient(90deg,#f9fcff 0,#f9fcff 192px,#eaf1f9 193px,#eaf1f9 194px)}
.tech-node{width:162px;min-height:72px;padding:6px 8px;border-radius:8px;line-height:1.25;font-size:11px;z-index:1}
.tech-node small{font-size:10px}.tech-node.special{border-left:4px solid #8d66b3}.tech-node.focus-target{box-shadow:0 0 0 2px #c19e52}
.tech-node.done{border-left-color:#259779}.tech-node.running{border-left-color:#2a74bd}.tech-node.selected{z-index:3}
.tech-domain-header{position:absolute;left:8px;padding:6px 9px;min-width:180px;font-weight:800;background:#dce9f8;border-radius:7px;color:#244666;border-left:4px solid #4b7eaf;font-size:12px}
.tech-domain-header small{font-size:10px;display:block;font-weight:500}
.tech-lane-label{left:14px;width:165px;font-size:10px;font-weight:700;padding:5px 7px;line-height:1.35}
.tech-lane-label.special{background:#f1eafb;color:#69438d}
.tech-domain-divider{position:absolute;left:0;right:0;height:1px;background:#d5e0ed}
.tech-board .branch{stroke:#7d9bb9;stroke-width:1.6;fill:none}
.tech-board .cross{stroke:#ab84b1;stroke-dasharray:5 4;stroke-width:1.6;fill:none}
.tech-board .interdomain{stroke:#ba9161;stroke-width:1.3;stroke-dasharray:3 6;fill:none;opacity:.65}
.tech-focus-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0;padding:9px 10px;border:1px solid #cbdbea;background:#f8fbff;border-radius:9px}
.tech-focus-row select{max-width:210px;font-size:12px}.tech-focus-row .hint{margin-left:auto;font-size:11px}
.tech-effect-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.tech-effect-grid div{background:#edf4fb;padding:8px;border-radius:8px;font-size:10px;color:#40627e}
.tech-effect-grid strong{display:block;color:#18476b;font-size:14px;margin-top:3px}
.tech-prereq{border-left:3px solid #a1b4c4}
.tech-prereq.foreign{border-color:#bf947b;background:#fff6ec}
.tech-detail{max-height:min(675px,74vh);overflow-y:auto}
@media(max-width:1150px){.tech-workspace{grid-template-columns:1fr}.tech-detail{max-height:none}}
.tech-effects-details summary{cursor:pointer;color:#235579;font-size:12px;padding:6px 0}.tech-effects-details{border:1px solid #d1dfec;border-radius:8px;padding:3px 8px;margin:10px 0}@media(max-width:700px){.tech-family-tabs{grid-template-columns:1fr}.tech-effect-grid{grid-template-columns:repeat(2,1fr)}.tech-board{height:540px}.tech-domain-tabs button{min-width:130px}}

const ym=(year,month)=>year*12+month-1;
const random=(s=S)=>{s.rng=(Math.imul(1664525,s.rng)+1013904223)>>>0;return s.rng/4294967296};
const rnd=(a,b,s=S)=>a+(b-a)*random(s);
const storageGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

function company(id,s=S){return s.firms.find(f=>f.id===id)}
function current(){return company(VIEW_FIRM)||company(S?.playerId)}
function acc(f,name){return f.ledger[name]||0}
function post(f,dr,cr,desc,kind='operating',s=S){const d=Object.entries(dr).map(([a,n])=>[a,Math.round(n)]).filter(x=>x[1]), c=Object.entries(cr).map(([a,n])=>[a,Math.round(n)]).filter(x=>x[1]); const ds=d.reduce((a,b)=>a+b[1],0),cs=c.reduce((a,b)=>a+b[1],0); if(ds!==cs||ds<0||!Number.isSafeInteger(ds))throw Error('仕訳不一致: '+desc+' '+ds+'/'+cs);if(!ds)return;for(const [a,n] of d){if(!ACCTYPE[a])throw Error('勘定科目 '+a);f.ledger[a]=(f.ledger[a]||0)+n}for(const [a,n] of c){if(!ACCTYPE[a])throw Error('勘定科目 '+a);f.ledger[a]=(f.ledger[a]||0)-n} f.journals.push({id:s.seq++,when:ym(s.year,s.month),text:desc,kind,amount:ds,dr:d,cr:c,fxAtPost:s?.world?.[f.country]?.fx??COUNTRIES[f.country].fx});if(f.journals.length>10000)f.journals.splice(0,f.journals.length-10000)}
function financials(f){const a=f.ledger;let assets=0,liab=0,eq=0,rev=0,exp=0;for(const [k,t] of Object.entries(ACCTYPE)){let v=a[k]||0;if(t==='asset'||t==='contra')assets+=v; if(t==='liability')liab-=v;if(t==='equity')eq-=v;if(t==='revenue')rev-=v;if(t==='expense')exp+=v}return {assets,liab,capital:eq,revenue:rev,expenses:exp,profit:rev-exp, equity:eq+rev-exp,cash:acc(f,'cash'),debt:-acc(f,'debt'),bsDiff:assets-liab-eq-rev+exp};}
function netWorth(f){const x=financials(f);return x.equity}
function logNotice(text,level='info',s=S){s.notices.unshift({id:s.seq++,when:dateKey(s),text,level});if(s.notices.length>75)s.notices.pop()}

function shareDealSimulation(s,buyer,target,percent,offerMultiplier){
 ensureGameplayV07(target);const fraction=roundShare(percent/100), available=target.shareBlocks.reduce((a,b)=>a+b.holding,0);
 if(!Number.isInteger(percent)||percent<1||percent>100||fraction>available+0.00000001)throw Error('取得割合は外部株主の売却可能持分以内で1%刻みです');
 if(!Number.isFinite(offerMultiplier)||offerMultiplier<.75||offerMultiplier>2.5)throw Error('提示倍率は0.75〜2.50倍としてください');
 // Acceptance is deterministic, not an unapproved random hostile takeover.
 const willing=[...target.shareBlocks].filter(x=>x.holding>0&&offerMultiplier+1e-9>=x.reserve).sort((a,b)=>a.reserve-b.reserve);
 const lots=[];let left=fraction;
 for(const h of willing){const q=Math.min(left,h.holding);if(q>0){lots.push({id:h.id,name:h.name,shares:roundShare(q),reserve:h.reserve});left=roundShare(left-q);}}

 const total=Math.round(reference*fraction*offerMultiplier);
 return {accepted:left<=.0000001,lots,left,reference,total,available};
}

   No fabricated vendor balances: outside suppliers are modeled as a bounded exogenous market. */
const SUPPLY_TYPES=['steel','rubber','components','aluminum','copper','glass','chemicals'];
const EXTRA_RESOURCES=['aluminum','copper','glass','chemicals'];
const SUPPLY_LABELS={steel:'鋼材',rubber:'ゴム',components:'部品セット',aluminum:'アルミニウム',copper:'銅',glass:'ガラス',chemicals:'化学原料・樹脂'};

function ensureMaterialMarkets(s){s.resourceMarkets??={};for(const [code,w] of Object.entries(s.world)){
 s.resourceMarkets[code]??={};for(const [t,m] of Object.entries({aluminum:1.75,copper:1.42,glass:.74,chemicals:.92}))
 s.resourceMarkets[code][t]??=Math.max(10,Math.round(w.steelPrice*m));}}
function evolveMaterialMarkets(s){ensureMaterialMarkets(s);for(const [code,w] of Object.entries(s.world))for(const [t,p] of Object.entries(s.resourceMarkets[code])){
 const anchor=(w.steelPrice*.75+w.rubberPrice*.25)*({aluminum:1.75,copper:1.42,glass:.74,chemicals:.92}[t]||1);
 const change=(anchor-p)*.04+p*(w.inflation/12+rnd(-.017,.017,s));s.resourceMarkets[code][t]=Math.max(10,Math.round(p+change));}}

function ensureSupplyNetwork(s){
 s.supplyNetwork??={nodes:[]};const old=s.supplyNetwork.nodes||[];const legacy=old.filter(n=>!n.firmId);
 const firms=s.firms.filter(f=>f.reorgStatus!=='integrated'&&f.lifecycle?.phase!=='withdrawn');
 const corporate=firms.flatMap(f=>{
  const products=f.industry==='resource'?SUPPLY_TYPES.filter(t=>t!=='components'):f.industry==='manufacturing'?['components']:[];
  return products.map(t=>({id:'CORP:'+f.id+':'+t,firmId:f.id,country:f.country,type:t,tier:t==='components'?1:3,
   upstream:t==='components'?['steel','rubber','copper'].map(k=>'CORP:'+f.id+':'+k):[],
   label:f.name,capacity:Math.max(12,Math.round((f.plant?.capacity||20)*(f.industry==='resource'?5:2.5))),quality:Math.round(55+(f.tech||1)*5)}));
 });
 // Use real firms as contract counterparties; legacy synthetic nodes stay only for saved shipments.
 s.supplyNetwork.nodes=[...corporate,...legacy];
 for(const f of s.firms){if(!f.supply?.contracts)continue;
  for(const t of SUPPLY_TYPES){const contract=f.supply.contracts[t];if(!contract)continue;
   const target=s.supplyNetwork.nodes.find(n=>n.id===contract.supplierId&&n.firmId&&n.firmId!==f.id);
   if(!target){const prev=s.supplyNetwork.nodes.find(n=>n.id===contract.supplierId);const available=corporate.filter(n=>n.type===t&&n.firmId!==f.id);
    const selected=available.find(n=>n.country===(prev?.country||f.country))||available[0];if(selected)contract.supplierId=selected.id;}
  }
 }
}

function deliverMaterials(s,f,events){const month=ym(s.year,s.month),arrivals=f.supply.inbound.filter(x=>x.due<=month);f.supply.inbound=f.supply.inbound.filter(x=>x.due>month);for(const shipment of arrivals){const node=s.supplyNetwork.nodes.find(n=>n.id===shipment.supplierId),seller=node?.firmId?company(node.firmId,s):null;
 if(seller&&seller.id!==f.id&&seller.country===f.country&&controller(s,f.id)&&controller(s,seller.id)){
   const src=shipment.type==='components'?seller.stock.components:seller.goods.RESOURCE;
   if(!src||src.q<shipment.qty||(shipment.type==='components'&&interplantUnassigned(seller)<shipment.qty)){shipment.due=month+1;f.supply.inbound.push(shipment);events.push('グループ内供給遅延：'+seller.name+' '+SUPPLY_LABELS[shipment.type]);continue;}
   const amount=shipment.qty===src.q?src.v:Math.round(src.v*shipment.qty/src.q);
   if(acc(f,'cash')<amount){shipment.due=month+1;f.supply.inbound.push(shipment);events.push('内部調達支払資金不足：'+f.name);continue;}
   src.q-=shipment.qty;src.v-=amount;
   post(seller,{cash:amount},{[shipment.type==='components'?'materials':'goods']:amount},'グループ内資材の簿価移管：'+SUPPLY_LABELS[shipment.type],'operating',s);
   post(f,{materials:amount},{cash:amount},'子会社・グループ会社からの簿価調達：'+SUPPLY_LABELS[shipment.type],'operating',s);
   const stock=f.stock[shipment.type]??={q:0,v:0};stock.q+=shipment.qty;stock.v+=amount;
   f.supply.history.push({month,type:shipment.type,origin:shipment.origin,qty:shipment.qty,totalBase:baseFromLocal(amount,f.country)/100,firmId:seller.id,group:true});continue;
 }
 const total=localFromBase(shipment.totalBase,f.country);if(!total)continue;post(f,{materials:total},{payable:total},'調達品受領：'+SUPPLY_LABELS[shipment.type]+' '+shipment.qty,'operating',s);const stock=f.stock[shipment.type]??={q:0,v:0};stock.q+=shipment.qty;stock.v+=total;f.payables.push({amount:total,due:month+1,note:'国際調達／部品仕入',account:'payable'});f.supply.history.push({month,type:shipment.type,origin:shipment.origin,qty:shipment.qty,totalBase:shipment.totalBase});if(f.supply.history.length>96)f.supply.history.shift();}}
function procureNetwork(s,events){
 ensureV20(s);ensureSupplyNetwork(s);
 const month=ym(s.year,s.month),risk=s.supplyRisk.active;
 const capacity=Object.fromEntries(s.supplyNetwork.nodes.map(node=>{
  const factor=risk[node.id]?.capacityFactor??1;
  return [node.id,Math.floor(node.capacity*(s.world[node.country].war?.73:1)*factor)];
 }));
 for(const f of s.firms){ensureNetwork(f,s);deliverMaterials(s,f,events);}
 for(const f of s.firms.filter(x=>['auto','manufacturing'].includes(x.industry)&&x.lifecycle?.phase!=='withdrawn'&&x.reorgStatus!=='integrated')){
  const plans=f.models.filter(m=>m.status==='active').map(m=>({q:Math.max(0,Math.ceil(f.plans[m.id]||0)),req:materialRequirement(m.design,f)}));
  for(const type of SUPPLY_TYPES){
   const contract=f.supply.contracts[type];
   const qualified=x=>x.type===type&&x.firmId&&x.firmId!==f.id;
   const main=s.supplyNetwork.nodes.find(x=>x.id===contract.supplierId&&qualified(x))||s.supplyNetwork.nodes.find(qualified);
   if(!main)continue;
   const alt=s.supplyNetwork.nodes.find(x=>x.id===contract.backupId&&x.id!==main.id&&qualified(x));
   const usage=plans.reduce((total,x)=>total+x.q*(x.req[type]||0),0);
   const buffer=clamp(Number(contract.buffer)||1,1,2);
   const minimum=EXTRA_RESOURCES.includes(type)?Math.ceil(usage*buffer):Math.max(Math.ceil(f.plant.capacity*(type==='components'?1:1.1)),Math.ceil(usage*buffer));
   const inTransit=f.supply.inbound.filter(x=>x.type===type).reduce((sum,x)=>sum+x.qty,0);
   // Quantize procurement to whole transport units; fractional raw-material consumption must not create sub-unit shipments.
   let needed=Math.max(0,Math.ceil(minimum-(f.stock[type]?.q||0)-inTransit));
   if(!needed)continue;
   const sourceList=alt?[main,alt]:[main];
   let alternativeQty=0;
   for(const node of sourceList){
    const assigned=Math.min(needed,Math.max(0,capacity[node.id]||0));if(!assigned)continue;
    needed-=assigned;capacity[node.id]-=assigned;
    if(node.id!==main.id)alternativeQty+=assigned;
    const overseas=node.country!==f.country,lead=(overseas?2:0)+(risk[node.id]?.delay||0);
    const rawUnit=supplierPriceBase(s,node),synergy=enterpriseSynergy(s,f);
    const unit=Math.max(1,Math.round(rawUnit*(1-synergy.resourceDiscount)));
    const freight=overseas?Math.max(45,Math.round(unit*.09)):0;
    f.supply.inbound.push({id:'SHIP'+s.seq++,type,origin:node.country,supplierId:node.id,qty:assigned,totalBase:assigned*(unit+freight),due:month+lead});
    if(lead===0)deliverMaterials(s,f,events);
   }
   if(alternativeQty)events.push(f.name+'：'+SUPPLY_LABELS[type]+'を代替供給先から'+alternativeQty+'単位確保');
   if(needed){events.push(f.name+'：'+SUPPLY_LABELS[type]+'の調達不足 '+needed+'単位'+(risk[main.id]?'（供給障害）':''));f.supplyRiskShortages=(f.supplyRiskShortages||0)+needed;}
  }
 }
}

function saveDistribution(){let before=null;try{
 const f=current();if(!canEdit(f))throw Error('権限がありません');ensureNetwork(f);
 const proposed=[];let setupCost=0;
 for(const code of Object.keys(S.world)){
  const channel=inputValue('channel_'+code),capacity=Math.round(intValue('capacity_'+code,1,10000));
  if(!['direct','dealer','distributor','subsidiary'].includes(channel))throw Error('販売契約種別が不正です');
  if(channel==='subsidiary'&&!f.distribution.salesCorporations[code]&&!controller(S,inputValue('dealer_'+code)))throw Error('支配下の現地販売会社がありません：'+NAMES[code]);
  const dealerId=inputValue('dealer_'+code)||'',dealer=dealerId?company(dealerId):null;if(dealerId&&(!dealer||dealer.id===f.id||dealer.country!==code))throw Error('販売店の契約法人が不正です');const old=f.distribution.contracts[code],newMarket=code!==f.country&&!f.marketPresence.includes(code);
  if(channel!==old.channel||capacity>old.capacity||newMarket){
   setupCost+=Math.round(Math.max(0,capacity-old.capacity)*(channel==='distributor'?450:channel==='subsidiary'?280:300)+(channel!==old.channel?9000:0)+(newMarket?12000:0));
  }
  proposed.push({code,old,channel,capacity,dealerId});
 }
 const localCost=localFromBase(setupCost,f.country);if(localCost>acc(f,'cash'))throw Error('販売店契約・物流投資に必要な資金が不足しています：'+baseMoney(cents(setupCost)));
 before=structuredClone(S);
 if(localCost)post(f,{advert:localCost},{cash:localCost},'国別販売店契約・物流能力の新規投資','operating');
 for(const {code,old,channel,capacity,dealerId} of proposed){f.distribution.contracts[code]={...old,channel,capacity,dealerId};
  if(!f.marketPresence.includes(code)&&channel!=='direct')f.marketPresence.push(code);
  if(channel==='dealer'||channel==='distributor'||channel==='subsidiary')f.dealers[code]=Math.max(f.dealers[code]||0,channel==='subsidiary'?65:35);
 }
 render();toast('販売網契約を更新しました。契約・能力増設費用：'+baseMoney(cents(setupCost)));
 }catch(e){if(before)S=before;render();toast(e.message)}}
function establishSalesCorporation(){let prior=null;try{const f=current(),code=inputValue('salesCorpCountry');if(!canEdit(f)||!code||code===f.country)throw Error('設立対象国を確認してください');ensureNetwork(f);if(f.distribution.salesCorporations[code])throw Error('この国にはすでに販売法人があります');const amount=verifyMoney(f,450000);prior=structuredClone(S);

 child.owners=[{id:f.id,econ:1,vote:1}];child.purpose='regional-sales-agent';

function sellMonthly(s,events){

    const keys=f.industry==='trade'?Object.keys(f.goods).filter(k=>k==='TRADE'||k.startsWith('IT')):['RESOURCE'];let left=Math.round(w.demand*.25);
    for(const key of keys){const qty=f.goods[key]?.q||0;if(qty&&left>0){const sell=Math.min(qty,left),price=f.goods[key].externalPriceBase||(f.industry==='trade'?1550:1800);sellGoods(s,f,key,sell,price,code,events);left-=sell;}}

   const sum=candidates.reduce((a,b)=>a+b.score,0);
   const weighted=candidates.map(x=>({...x,raw:count*x.score/Math.max(.0001,sum),allocated:Math.floor(count*x.score/Math.max(.0001,sum))}));
   const left=count-weighted.reduce((a,b)=>a+b.allocated,0);

    else exportShipment(s,x.f,x.m.id,approved,x.m.priceBase,code,events,segment);
   }
  }
 }
}

async function runMonth(){

  step('MA',()=>processMAMonth(trial,events));

   updateWorld(trial,totals);evolveMaterialMarkets(trial);

  });

  });
  step('CHECK_AFTER',()=>{const errs=check(trial);if(errs.length)throw Error('月末整合性検証失敗：'+errs.slice(0,15).join(' / '))});

   trial.consoHistory??=[];trial.consoHistory.push({month:trial.monthCommitted,cash:reportConso.bs.cash,fxCash:reportConso.fxBalance?.cash??reportConso.bs.cash,firmCash:reportConso.cashByFirm||{},equity:reportConso.bs.equity,consolidatedProfit:reportConso.pl.profit,cf:reportConso.cf,periodPL:reportConso.periodPL,spotDeferredInventory:reportConso.spotDeferredInventory,deferredByTx:reportConso.deferredByTx});

 }catch(err){
  if(!committed){S=prev;monthlyPreview=false;LAST_MONTH_DIAGNOSTIC=makeMonthlyDiagnostic(err,stage,prev,trial,events,false);MONTH_DIAGNOSTIC_OPEN=true;}
  else {LAST_MONTH_DIAGNOSTIC=makeMonthlyDiagnostic(err,stage,prev,trial,events,true);MONTH_DIAGNOSTIC_OPEN=true;monthlyPreview=false;}
  try{render()}catch(renderErr){console.error('診断パネル表示失敗',renderErr);document.getElementById('modalHost').innerHTML=monthDiagnosticDialog()}
  toast(committed?'月次計算は確定済みですが、確定後の処理で問題が発生しました。':'月次処理が中断されました。原因と対処を診断画面で確認してください。');
  console.error('[月次処理]',stage,err);
 }finally{MONTH_RUNNING=false}
}
function savePayload(s){const json=JSON.stringify(s);return JSON.stringify({format:'CONGLOMERATE',version:VERSION,checksum:hash(json),payload:json,savedAt:new Date().toISOString()})}
function parsePayload(raw){if(typeof raw!=='string')throw Error('保存データが存在しません');const obj=JSON.parse(raw);if(obj.format!=='CONGLOMERATE'||obj.version!==VERSION)throw Error('対応しない保存形式です');if(hash(obj.payload)!==obj.checksum)throw Error('チェックサム不一致');const s=JSON.parse(obj.payload);ensureV11(s);ensureMAState(s);ensureV20(s);ensureSupplyNetwork(s);for(const f of s.firms||[]){ensureFirmGameplay(f);ensureNetwork(f,s);}const errs=check(s);if(errs.length)throw Error(errs.slice(0,3).join(' / '));return s}
function openDatabase(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('IndexedDBに非対応の環境です'));const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots',{keyPath:'key'});if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'})};req.onsuccess=()=>{req.result.onversionchange=()=>req.result.close();resolve(req.result)};req.onerror=()=>reject(req.error||Error('保存領域の初期化失敗'));req.onblocked=()=>reject(Error('他のタブがデータベースを使用中です'))})}
function idbRead(store,key){return new Promise((resolve,reject)=>{const tx=IDB.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result??null);r.onerror=()=>reject(r.error||Error('保存領域の読み出し失敗'))})}
function idbWrite(store,record){return new Promise((resolve,reject)=>{const tx=IDB.transaction(store,'readwrite');tx.oncomplete=()=>resolve();tx.onabort=()=>reject(tx.error||Error('保存領域の書込み中断'));tx.onerror=()=>reject(tx.error||Error('保存領域の書込み失敗'));tx.objectStore(store).put(record)})}
function slotRecord(key,raw){const s=parsePayload(raw),o=JSON.parse(raw);return {key,serialized:raw,savedAt:o.savedAt,year:s.year,month:s.month,name:company(s.playerId,s)?.name||'不明'}}
function inspectRecord(rec){if(!rec)return null;try{const s=parsePayload(rec.serialized);return {date:`${s.year}年${s.month}月`,name:company(s.playerId,s)?.name||'不明',savedAt:rec.savedAt}}catch(e){return {error:String(e.message)}}}
async function refreshSaveIndex(){if(!IDB)return;const meta=await idbRead('meta','active');SAVE_INDEX.active=meta?.slot??null;SAVE_INDEX.previous=meta?.previousSlot??null;SAVE_INDEX.activeChecksum=meta?.checksum??null;SAVE_INDEX.previousChecksum=meta?.previousChecksum??null;for(let i=0;i<3;i++)SAVE_INDEX.auto[i]=await idbRead('snapshots','auto:'+i);for(let i=0;i<3;i++)SAVE_INDEX.manual[i]=await idbRead('snapshots','manual:'+i)}
async function importLegacyOnce(){// Migration only if the new database has no existing snapshots; original v0.1 localStorage is not altered.
 for(let i=0;i<3;i++)if(await idbRead('snapshots','auto:'+i))return;
 for(let i=0;i<3;i++)if(await idbRead('snapshots','manual:'+i))return;
 let copied=0;
 for(let i=0;i<2;i++){const raw=storageGet(AUTOKEY+i);if(!raw)continue;try{await idbWrite('snapshots',slotRecord('auto:'+i,raw));copied++}catch(e){console.warn('旧自動保存世代の移行をスキップ',i,e)}}
 for(let i=0;i<3;i++){const raw=storageGet(MANKEY+i);if(!raw)continue;try{await idbWrite('snapshots',slotRecord('manual:'+i,raw));copied++}catch(e){console.warn('旧手動保存の移行をスキップ',i,e)}}
 if(copied){const p=storageGet(POINTER);let active=p==='0'||p==='1'?Number(p):0;if(!await idbRead('snapshots','auto:'+active))active=1-active;if(await idbRead('snapshots','auto:'+active)){const old=1-active,oldRecord=await idbRead('snapshots','auto:'+old),activeRecord=await idbRead('snapshots','auto:'+active);await idbWrite('meta',{key:'active',slot:active,checksum:hash(activeRecord.serialized),previousSlot:oldRecord?old:null,previousChecksum:oldRecord?hash(oldRecord.serialized):null});}SAVE_INDEX.legacyImported=true;saveWarning='v0.1の保存データをIndexedDBへコピーしました。旧データは削除していません。';}
}
async function saveAuto(){if(!IDB){if(S)S.autosaveState='保存失敗';saveWarning='IndexedDBを利用できません。JSONバックアップをご利用ください。';return false}if(SAVE_BUSY){saveWarning='保存処理が重複しています';return false}SAVE_BUSY=true;
 try{const meta=await idbRead('meta','active');const slot=[0,1,2].find(i=>i!==meta?.slot&&i!==meta?.previousSlot);if(slot===undefined)throw Error('保存用の予備世代がありません');
  const snapshot=structuredClone(S);snapshot.autosaveState='保存成功';const raw=savePayload(snapshot);const rec=slotRecord('auto:'+slot,raw);
  // Phase 1: prepare the inactive generation, commit, then read it back and check its whole state.
  await idbWrite('snapshots',rec);const reread=await idbRead('snapshots','auto:'+slot);if(!reread||reread.serialized!==raw)throw Error('保存内容の読み戻し照合に失敗');parsePayload(reread.serialized);
  // Phase 2: only change the active-generation pointer after full validation.
  await idbWrite('meta',{key:'active',slot,checksum:hash(raw),previousSlot:meta?.slot??null,previousChecksum:meta?.checksum??null,updatedAt:new Date().toISOString()});S.autosaveState='保存成功';saveWarning='';await refreshSaveIndex();return true;
 }catch(e){S.autosaveState='保存失敗';saveWarning=String(e?.message||e);try{await refreshSaveIndex()}catch(_){}return false}finally{SAVE_BUSY=false}}
async function saveManual(num){if(!IDB){toast('IndexedDBを使えません。JSONでバックアップしてください。');return}if(SAVE_BUSY){toast('保存中です。重複書込みを回避しました。');return}SAVE_BUSY=true;

async function restoreAuto(){const generations=[{slot:SAVE_INDEX.active,checksum:SAVE_INDEX.activeChecksum},{slot:SAVE_INDEX.previous,checksum:SAVE_INDEX.previousChecksum}];for(const entry of generations){const k=entry.slot;if(k===null||k===undefined||!entry.checksum)continue;const rec=SAVE_INDEX.auto[k];if(rec){try{if(hash(rec.serialized)!==entry.checksum)throw Error('保存世代の確定チェックサムが異なります');const s=parsePayload(rec.serialized);S=s;VIEW_FIRM=s.playerId;VIEW_COUNTRY=company(s.playerId,s).country;return true}catch(e){console.warn('保存世代を検証できません',k,e)}}}return false}

function businessDiagnostics(f){const alerts=[];function add(level,title,detail,page){alerts.push({level,title,detail,page});}
 const cash=baseFromLocal(acc(f,'cash'),f.country)/100;const staff=Object.values(f.staff).reduce((a,b)=>a+b,0);const wageEstimate=staff*S.world[f.country].wage*eraCostFactor(S.year);
 if(cash<Math.max(20000,wageEstimate*1.5))add('warn','運転資金が薄い','現金が概算1.5か月分の賃金相当を下回っています。研究費・工場固定費等も別途必要です。','finance');
 if(['auto','manufacturing'].includes(f.industry)){
 ensureQualityV017(f);const openQuality=Object.values(f.qualityProgram.flags).filter(x=>x.status==='open').length;if(openQuality)add('warn','品質警報が未解決',openQuality+'車種で保証修理の増加が検出されています。自主リコールの費用と放置時のブランド毀損を比較してください。','product');
 const planned=Object.values(f.plans).reduce((a,b)=>a+(Number(b)||0),0),cap=factoryCapacity(f).possible;
 if(planned>cap)add('warn','生産計画が設備能力を超過',`計画${nfmt(planned)}台 / 実効能力${nfmt(cap)}台。減産や無駄な段取り費用の可能性があります。`,'product');
 if(f.plant.condition<60)add('warn','設備保全が必要','工場設備の状態が60%未満です。設備稼働率と維持負担に注意。','factory');
 if(planned>0&&(f.stock.steel.q<planned||f.stock.rubber.q<planned))add('info','材料在庫に注意','完成車計画に比べ鋼材またはゴムの在庫が少ない状態です。月内調達予定を確認してください。','supply');
 for(const m of f.models.filter(x=>x.status==='active').slice(0,30)){try{const unit=productCostQuote(f,m.design||DESIGN_DEFAULT).unitCost;if(m.priceBase<unit)add('warn',`原価割れの可能性：${m.name}`,`標準原価${baseMoney(cents(unit))} / 設定売価${baseMoney(cents(m.priceBase))}。輸送費や販売費も別途必要です。`,'product');}catch(e){} }
 if(f.models.some(m=>m.status==='active'&&(m.months||0)>72))add('info','モデルの陳腐化が進行','発売後6年以上の車種があります。改良・新型車投入と既存在庫の回収を検討してください。','product');
 const goods=Object.values(f.goods||{}).reduce((a,b)=>a+(b.q||0),0);if(f.monthly.units>0&&goods>f.monthly.units*4)add('info','完成品在庫が大きい',`在庫${nfmt(goods)}個 / 直近販売${nfmt(f.monthly.units)}個。過剰在庫の可能性があります。`,'product');
 }
 ensureResearchTree(f);
 if(f.research.roadmap.targets.some(id=>!f.research.tree.done.includes(id))){if(!f.rnd.budgetBase||!f.staff.research)add('warn','研究ロードマップが停滞','目標技術が未達ですが、研究予算または研究人員がゼロです。','people');else if(!f.research.roadmap.auto)add('info','研究目標は手動管理中','目標が登録されていますが、自動経路優先はOFFです。必要なら研究画面でONにしてください。','people');}
 return alerts;
}

function renameCompany(){try{
 const target=company(inputValue('renameCompanyId'));if(!target||!controller(S,target.id))throw Error('他社の社名は変更できません');
 const raw=inputValue('renameCompanyName');const name=(raw||'').trim().replace(/\s+/g,' ');
 if(!name||name.length>38)throw Error('社名を1～38文字で入力してください');
 if(S.firms.some(f=>f.id!==target.id&&f.name.toLocaleLowerCase()===name.toLocaleLowerCase()))throw Error('同じ名前の法人が存在します');
 const before=target.name;target.name=name;if(target.id===S.playerId)S.config.name=name;
 for(const node of S.supplyNetwork?.nodes||[])if(node.firmId===target.id)node.label=name;
 render();toast('社名変更：'+before+' → '+name+'。企業ID・株主・会計は変更されません。');
 }catch(e){toast(e.message)}}
function renamePlant(plantId){try{
 const f=current();if(!canEdit(f))throw Error('他社の工場名は変更できません');ensureFirmGameplay(f);

 const raw=document.getElementById('renamePlant_'+p.id)?.value||'';const name=raw.trim().replace(/\s+/g,' ');
 if(!name||name.length>32)throw Error('工場名を1～32文字で入力してください');
 if(f.plants.some(x=>x.id!==p.id&&x.name.toLocaleLowerCase()===name.toLocaleLowerCase()))throw Error('同じ法人内に同名の工場があります');
 const before=p.name;p.name=name;render();toast('工場名変更：'+before+' → '+name+'。設備・立地・工場IDは維持されます。');
 }catch(e){toast(e.message)}}

async function diagnoseStorage(){
 if(!IDB){toast('保存診断：IndexedDB未使用。ローカル起動方法を確認してください');return;}
 if(SAVE_BUSY||MONTH_RUNNING){toast('月次処理・保存が完了してから診断してください');return;}
 const key='diagnostic:v04:'+String(Date.now()),value='conglomerate-v04-'+Math.random().toString(36).slice(2);
 const rec={key,serialized:value,savedAt:new Date().toISOString()},results=[];
 const remove=async()=>new Promise((resolve,reject)=>{
  const tx=IDB.transaction('snapshots','readwrite');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
  tx.objectStore('snapshots').delete(key);
 });
 try{
  // The diagnostic writes only an isolated key; never change the save-slot pointer.
  await idbWrite('snapshots',rec);results.push('独立キー書込成功');
  const got=await idbRead('snapshots',key);
  if(got?.serialized!==value)throw Error('読戻し不一致');results.push('読戻し一致');
  IDB.close();IDB=await openDatabase();
  const reopened=await idbRead('snapshots',key);
  if(reopened?.serialized!==value)throw Error('DB再接続後の内容不一致');results.push('接続終了・再開後も一致');
  await remove();const removed=await idbRead('snapshots',key);
  if(removed)throw Error('テストデータを削除できません');results.push('隔離データ削除成功');
  saveWarning='保存診断：'+results.join('、')+'。ページ再読込・端末終了時の保護まで保証する試験ではありません。';
  toast('IndexedDB実機診断合格：読書・再接続・削除');
 }catch(e){saveWarning='保存診断失敗：'+e.message;toast(saveWarning);
  try{if(IDB){const x=await idbRead('snapshots',key);if(x)await remove();}}catch(_){}}
 finally{try{await refreshSaveIndex();}catch(e){console.warn(e)}render();}
}

 <section class="panel span5"><h2>バックアップと新しいゲーム</h2><div class="vlist"><button class="btn" data-action="diagnoseStorage">IndexedDB実機診断（既存セーブ非変更）</button><button class="btn primary" data-action="export">現在の状態をJSONで書き出す</button><button class="btn" data-action="import">JSONバックアップを読み込む</button><button class="btn danger" data-action="newGame">新しいゲームを開始する</button></div><div class="sep"></div><h3>現在の保存状態</h3>${rowstat('保存バックエンド',tag(SAVE_INDEX.backend,SAVE_INDEX.backend==='IndexedDB'?'good':'warn'))}${rowstat('計算状態',S.monthCommitted===ym(S.year,S.month)?'当月確定済み':'次月実行待ち')}${rowstat('自動保存',S.autosaveState==='保存成功'?tag('成功','good'):tag(S.autosaveState,'warn'))}${rowstat('検算',check(S).length?tag('異常','bad'):tag('合格','good'))}${SAVE_INDEX.legacyImported?`<div class="note">旧版v0.1から保存データをコピーしました。旧キーは保持しています。</div>`:''}${saveWarning?`<div class="note warnbox">${esc(saveWarning)}</div>`:''}<div class="sep"></div><h3>保存の限界</h3><p class="small muted">IndexedDBもブラウザ・端末内の保存です。ブラウザデータ削除や端末故障には対応できません。重要なセーブはJSONを別の場所へ保管してください。</p><p class="small muted">読み込んだJSONはその場のゲーム状態として検証します。保存枠に残すには手動セーブしてください。</p></section><section class="panel span12"><h2>史実基準データと対応機能</h2><div class="scroll"><table><thead><tr><th>機能</th><th>現段階</th><th>正式仕様との関係</th></tr></thead><tbody>${[['創業シナリオ・歴史モード・国','試作動作','歴史的国境・通貨制度の正確な再現は未完成'],['主要国の開始年人口基準値','参考統計を導入','推計人口の概数を内蔵。経済・需要・金融の係数は仮'],['自動車生産・販売・在庫・原価','試作動作','工程別仕掛品・取引詳細は一部未完成'],['国別市場・原材料調達・競合AI','試作動作','市場価格・契約割当・政策係数は仮'],['研究・設備・人員・標準借入','試作動作','労使交渉・設備保守の詳細は未実装'],['業態別子会社設立・株式取得','試作動作','高度な権限審査・M&A評価は未完成'],['連結三表・非支配株主持分・内部消去','試作動作','取得時帳簿スナップショット、確定月CF履歴、変動レートの換算ブリッジを追加。正式PPA・歴史通貨制度は未確定'],['IndexedDB・保護2世代＋候補・手動3枠・JSON','試作動作','端末データ消失は外部バックアップで備える'],['長期性能と正式数式の受入試験','未完了','正式な定量係数・性能基準は未決定']].map(([a,b,c])=>`<tr><td>${a}</td><td>${tag(b,b==='未実装'||b==='未完了'?'warn':'good')}</td><td>${c}</td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:13px">人口基準値：<a href="${POP_SOURCE}" target="_blank" rel="noopener">Our World in Data / Gapminder / UN WPP</a> を参照した歴史推計の概数（2020年以前）。現在の国境に合わせた統計であり、1900年当時の国家領域を再現するものではありません。ゲーム実行中に外部データを取得しません。</div></section></div>`}

/* CONGLOMERATE v0.18 — M&A discovery, offer evaluation, financial settlement,
   explicit shareholder classes and AI acquisition + post-merger integration.
   All valuations, seller reservations and synergies are illustrative parameters.
   PUBLIC is a summary bucket of external holders, never a listed company. */
let MA_VIEW={country:'all',industry:'all',status:'all',sort:'value',target:'',maxPrice:0};
const MA_EXTERNAL_CLASSES={
 founder:'創業者・個人',bank:'銀行・金融機関',government:'政府・公的機関',
 institutional:'投資信託・保険',individual:'一般個人・分散株主',freefloat:'一般個人・分散株主'
};
function ensureMAState(s){
 s.maDeals??=[];s.maPlans??=[];s.maAIHistory??=[];
 for(const f of s.firms||[]){
  ensureGameplayV07(f);
  // Preserve the six-digit external share total exactly on migration from v0.17.
  if(!f.maShareClassesV18){
   const inst=f.shareBlocks.find(b=>b.id==='institutional'),float=f.shareBlocks.find(b=>b.id==='freefloat');
   if(inst&&!f.shareBlocks.some(b=>b.id==='bank')){
    const bank=roundShare(inst.holding*.42);inst.holding=roundShare(inst.holding-bank);
    f.shareBlocks.push({id:'bank',name:'銀行・金融機関',weight:.15,reserve:1.10,holding:bank});
   }
   if(float&&!f.shareBlocks.some(b=>b.id==='government')){
    const publicOrg=roundShare(float.holding*.14);float.holding=roundShare(float.holding-publicOrg);
    f.shareBlocks.push({id:'government',name:'政府・公的機関',weight:.05,reserve:1.25,holding:publicOrg});
   }
   // Existing freefloat is retained with its original ID, so all old saves remain readable.
   f.maShareClassesV18=true;
  }
  for(const h of f.shareBlocks){h.name=MA_EXTERNAL_CLASSES[h.id]||h.name||'その他外部株主';h.reserve=Number.isFinite(h.reserve)?h.reserve:1.1;}
  f.maCooldown??=-200;f.maReputation??=50;
 }
}
function maMoney(n){return baseMoney(cents(n));}
function maPct(r){return nfmt(Math.round((r||0)*10000)/100)+'%';}
function maOwnership(f,s=S){
 const player=controlSet(s,s.playerId),own=f.owners.filter(x=>x.id!=='PUBLIC');
 return {own:own.reduce((a,o)=>a+o.econ,0),players:own.filter(x=>player.has(x.id)).reduce((a,o)=>a+o.econ,0),public:f.owners.find(o=>o.id==='PUBLIC')?.econ||0,blocks:f.shareBlocks||[]};
}
function ownershipShort(f,s=S){const sh=maOwnership(f,s);const firms=f.owners.filter(o=>o.id!=='PUBLIC');const own=firms.map(o=>esc(company(o.id,s)?.name||'企業株主')+' '+maPct(o.econ));const x=sh.public>0?['外部（銀行・政府・個人等） '+maPct(sh.public)]:[];return [...own,...x].join(' / ')||'株主不明';}
function maValuation(s,f){
 const a=financials(f),fx=COUNTRIES[f.country].fx;
 const toBase=v=>Math.round(v*fx/100);
 const book=Math.max(0,toBase(a.equity)),cash=Math.max(0,toBase(a.cash)),debt=Math.max(0,toBase(a.debt));
 const sales=Math.max(0,toBase(f.monthly?.sales||0))*12,profit=toBase(f.monthly?.profit||0)*12;
 const loss=Math.max(0,-profit), risk=clamp((f.distress?.stage||0)*.10+(debt>book*1.5?.11:0)+(profit<0?.05:0),0,.48);
 const operation=Math.max(50000,Math.round(sales*.18+Math.max(0,profit)*1.6));
 const bookComponent=Math.max(0,Math.round(book*.8));
 const reference=Math.max(150000,Math.round((bookComponent*.75+operation*.25)*(1-risk)));
 return {book,cash,debt,sales,profit,risk,operation,reference,method:'純資産80%補正・年換算業績・財務リスク'};
}
function maQuote(s,buyer,target,percent,multiplier){
 if(!buyer||!target||buyer.id===target.id)throw Error('買い手と対象企業を別々に指定してください');
 if(controller(s,buyer.id,target.id))throw Error('対象企業が買い手を支配しているため循環保有になります');
 if(target.reorgStatus==='integrated'||target.lifecycle?.phase==='withdrawn')throw Error('統合済み・市場退出法人の買収には対応していません');
 if(!Number.isInteger(percent)||percent<1||percent>100)throw Error('取得割合は1〜100%の整数で指定してください');
 if(!Number.isFinite(multiplier)||multiplier<.75||multiplier>2.5)throw Error('提示倍率は75〜250%で指定してください');
 const v=maValuation(s,target),q=roundShare(percent/100),publicHolding=target.owners.find(o=>o.id==='PUBLIC')?.econ||0;
 if(q>publicHolding+1e-8)throw Error('外部株主の売却可能持分は'+maPct(publicHolding)+'です。企業株主の株式は交渉対象外です');
 const ordered=(target.shareBlocks||[]).filter(h=>h.holding>0&&multiplier+1e-9>=h.reserve).sort((a,b)=>a.reserve-b.reserve);
 let left=q;const lots=[];
 for(const h of ordered){const take=Math.min(left,h.holding);if(take>0){lots.push({id:h.id,name:h.name,holding:roundShare(take),reserve:h.reserve});left=roundShare(left-take);}if(left<.000001)break;}
 const total=Math.round(v.reference*q*multiplier),available=Math.max(0,Math.round(acc(buyer,'cash')*COUNTRIES[buyer.country].fx/100));
 return {...v,percent,multiplier,total,available,lots,missing:Math.max(0,left),accepted:left<.000001&&total<=available,consent:left<.000001,affordable:total<=available,publicHolding};
}
function executeMADeal(s,buyerId,targetId,percent,multiplier,actor='player'){
 ensureMAState(s);const buyer=company(buyerId,s),target=company(targetId,s);
 const quote=maQuote(s,buyer,target,percent,multiplier);
 if(!quote.consent)throw Error('必要な株式が集まりません。売却条件を引き上げるか取得割合を減らしてください（不足'+maPct(quote.missing)+'）');
 if(!quote.affordable)throw Error('買収資金不足：見積 '+maMoney(quote.total)+'、手元現金 '+maMoney(quote.available));
 const paid=localFromBase(quote.total,buyer.country);
 if(paid>acc(buyer,'cash'))throw Error('買収に利用できる現金が不足しています');
 const hadControl=controller(s,target.id,buyerId);
 post(buyer,{investment:paid},{cash:paid},'M&A株式取得：'+target.name,'investing',s);
 const journal=buyer.journals.at(-1).id;
 const publicEntry=target.owners.find(o=>o.id==='PUBLIC');
 for(const lot of quote.lots){const h=target.shareBlocks.find(x=>x.id===lot.id);h.holding=roundShare(h.holding-lot.holding);}
 const take=roundShare(percent/100);publicEntry.econ=roundShare(publicEntry.econ-take);publicEntry.vote=roundShare(publicEntry.vote-take);
 if(publicEntry.econ<.000001)target.owners=target.owners.filter(o=>o.id!=='PUBLIC');
 let currentOwner=target.owners.find(o=>o.id===buyer.id);
 if(!currentOwner){currentOwner={id:buyer.id,econ:0,vote:0};target.owners.push(currentOwner);}
 currentOwner.econ=roundShare(currentOwner.econ+take);currentOwner.vote=roundShare(currentOwner.vote+take);
 const nowControl=controller(s,target.id,buyerId);
 registerEquityLink(s,{parentId:buyerId,childId:targetId,ratio:take,kind:'acquisition',considerationLocal:paid,buyerJournal:journal,bookEquityBase:baseFromLocal(netWorth(target),target.country),cashAcquiredBase:baseFromLocal(acc(target,'cash'),target.country),controlEstablished:nowControl&&!hadControl});
 const entry={id:'MA'+s.seq++,month:ym(s.year,s.month),buyer:buyerId,target:targetId,percent,priceBase:quote.total,multiplier,actor,holders:quote.lots.map(l=>({name:l.name,percent:Math.round(l.holding*10000)/100})),control:nowControl,reference:quote.reference};
 s.maDeals.unshift(entry);if(s.maDeals.length>150)s.maDeals.pop();
 // Legacy negotiated equity history also stays available to older reports.
 s.negotiationHistory??=[];s.negotiationHistory.unshift({month:entry.month,buyer:buyerId,target:targetId,percent,priceBase:entry.priceBase,multiplier,holders:quote.lots.map(l=>l.name),control:nowControl});if(s.negotiationHistory.length>80)s.negotiationHistory.pop();
 buyer.maCooldown=ym(s.year,s.month);
 if(nowControl&&!hadControl){
  s.maPlans.push({id:'PMI'+s.seq++,buyer:buyerId,target:targetId,start:entry.month,months:0,duration:6,progress:0,mode:actor==='ai'?'active':'pending',costBase:Math.max(800,Math.round(quote.total*.016/6)),actor,done:false});
 }
 return entry;
}
function maBeginPlan(s,id){const p=s.maPlans.find(x=>x.id===id);if(!p||p.mode!=='pending')throw Error('統合待ちの案件が見つかりません');if(!controller(s,p.target,p.buyer))throw Error('統合開始には対象企業の議決権支配が必要です');p.mode='active';return p;}
function processMAMonth(s,events){
 ensureMAState(s);const month=ym(s.year,s.month);
 for(const p of s.maPlans){if(!['active','paused'].includes(p.mode)||p.done)continue;
  const buyer=company(p.buyer,s),target=company(p.target,s);if(!buyer||!target||!controller(s,target.id,buyer.id)){p.mode='halted';continue;}
  const fee=localFromBase(p.costBase,buyer.country);
  if(acc(buyer,'cash')<fee){p.mode='paused';events.push(buyer.name+'：'+target.name+'の統合を資金不足で一時停止');continue;}
  p.mode='active';
  // Fees are real operating expenses; operational improvements affect real market/plant state.
  spendExpense(buyer,'otherExpense',fee,'PMI経営統合・調整費用：'+target.name,'operating',s);
  p.months++;p.progress=Math.round(p.months/p.duration*100);
  if(target.reorgStatus!=='integrated'){
   for(const code of target.marketPresence||[]){target.brand[code]=clamp((target.brand[code]||0)+.20,0,95);target.dealers[code]=clamp((target.dealers[code]||0)+.13,0,95);}
   const live=(target.plants||[]).filter(x=>!x.construction);for(const plant of live)plant.condition=clamp(plant.condition+.08,0,100);
   syncPlant(target);
  }
  if(p.months>=p.duration){p.done=true;p.mode='completed';target.maReputation=clamp((target.maReputation||50)+3,0,100);events.push(buyer.name+'と'+target.name+'の経営統合が完了（法人・株主は存続）');}
 }
 // AI major transactions: monthly evaluation, at most one independent-company acquisition per 6-month window.
 if(![1,7].includes(s.month)||s.firms.length<3)return;
 const pool=s.firms.filter(f=>!f.player&&!controller(s,f.id)&&f.lifecycle?.phase==='active'&&f.reorgStatus!=='integrated'&&month-(f.maCooldown||-200)>18&&financials(f).cash>localFromBase(250000,f.country)&&financials(f).equity>0).sort((a,b)=>financials(b).cash/COUNTRIES[b.country].fx-financials(a).cash/COUNTRIES[a.country].fx);
 let completed=0;
 for(const buyer of pool.slice(0,7)){
  if(completed>=1)break;
  if(random(s)>.45)continue;
  const options=s.firms.filter(t=>t.id!==buyer.id&&t.lifecycle?.phase==='active'&&t.reorgStatus!=='integrated'&&!controller(s,t.id)&&!controller(s,buyer.id,t.id)&&(t.owners.find(o=>o.id==='PUBLIC')?.econ||0)>.51&&(t.maCooldown||-200)<month-12)
    .map(t=>({t,quote:null,score:(t.country===buyer.country?20:0)+(t.industry!==buyer.industry?9:3)+(t.distress?.stage||0)*3+Math.max(0,35-Math.abs(financials(t).equity/Math.max(1,financials(buyer).equity))*15)}))
    .sort((a,b)=>b.score-a.score).slice(0,6);
  for(const choice of options){const target=choice.t;let started=false;
   try{const q=maQuote(s,buyer,target,55,1.26);if(!q.accepted||q.total>q.available*.47)continue;
    started=true;const deal=executeMADeal(s,buyer.id,target.id,55,1.26,'ai');
    const err=check(s);if(err.length)throw Error(err[0]);
    events.push('AI M&A：'+buyer.name+'が'+target.name+'の55%を'+maMoney(deal.priceBase)+'で取得。6か月の経営統合を開始');
    s.maAIHistory.unshift(deal.id);if(s.maAIHistory.length>50)s.maAIHistory.pop();completed++;break;
   }catch(e){ // If a candidate is inadmissible, no transaction has been made; do not emit fictitious events.
    if(started)throw e;
   }
  }
 }
}
function maFiltered(){ensureMAState(S);return S.firms.filter(f=>{
 const o=maOwnership(f),owned=controller(S,f.id);
 if(MA_VIEW.country!=='all'&&f.country!==MA_VIEW.country)return false;
 if(MA_VIEW.industry!=='all'&&f.industry!==MA_VIEW.industry)return false;
 if(MA_VIEW.status==='independent'&&(owned||o.public<.01))return false;
 if(MA_VIEW.status==='group'&&!owned)return false;
 if(MA_VIEW.status==='available'&&(owned||o.public<.01||f.lifecycle?.phase==='withdrawn'||f.reorgStatus==='integrated'))return false;
 if(MA_VIEW.maxPrice>0&&maValuation(S,f).reference>MA_VIEW.maxPrice)return false;
 return true;

function capitalQuote(s,f,percent,issueFactor){
 ensureV20(s);
 if(!Number.isInteger(percent)||percent<5||percent>35)throw Error('新株数は既存発行済株式の5〜35%で指定してください');
 if(!Number.isFinite(issueFactor)||issueFactor<.8||issueFactor>1.2)throw Error('発行価格倍率は80〜120%で指定してください');

 const valuation=maValuation(s,f),grossBase=Math.max(1,Math.round(valuation.reference*newShares/preShares*issueFactor));
 const proceedsLocal=localFromBase(grossBase,f.country),dilution=newShares/postShares;

}
function executeCapitalIssuance(s,issuerId,percent,issueFactor,investor,actor='player'){

 const f=company(issuerId,s);
 if(!f||!CAPITAL_INVESTORS[investor])throw Error('発行会社・引受人区分が正しくありません');
 if(f.lifecycle?.phase==='withdrawn'||f.reorgStatus==='integrated')throw Error('市場撤退・統合法人は発行できません');
 const month=ym(s.year,s.month);
 if(month-f.capitalPolicy.lastIssueMonth<12)throw Error('新株発行は12か月に1回までです');
 const q=capitalQuote(s,f,percent,issueFactor);
 if(q.proceedsLocal<1)throw Error('発行額が小さすぎます');
 // Avoid a conversion overflow / inconsistent rounded currency amount.
 if(q.proceedsLocal>Number.MAX_SAFE_INTEGER)throw Error('資本金額が上限を超えています');
 const before=structuredClone({owners:f.owners,blocks:f.shareBlocks,shares:f.sharesOutstanding});
 post(f,{cash:q.proceedsLocal},{capital:q.proceedsLocal},'外部向け新株発行：'+CAPITAL_INVESTORS[investor],'financing',s);
 const oldRatio=q.preShares/q.postShares;
 for(const owner of f.owners){owner.econ=roundShare(owner.econ*oldRatio);owner.vote=roundShare(owner.vote*oldRatio);}
 const oldPublic=f.owners.find(x=>x.id==='PUBLIC');
 const companyHoldings=f.owners.filter(x=>x.id!=='PUBLIC').reduce((a,o)=>a+o.econ,0);
 const publicRatio=roundShare(1-companyHoldings);
 if(oldPublic){oldPublic.econ=publicRatio;oldPublic.vote=roundShare(1-f.owners.filter(x=>x.id!=='PUBLIC').reduce((a,o)=>a+o.vote,0));}
 else f.owners.push({id:'PUBLIC',econ:publicRatio,vote:roundShare(1-f.owners.reduce((a,o)=>a+o.vote,0))});
 for(const h of f.shareBlocks||[])h.holding=roundShare(h.holding*oldRatio);
 f.shareBlocks??=[];
 let block=f.shareBlocks.find(h=>h.id===investor);
 if(!block){block={id:investor,name:CAPITAL_INVESTORS[investor],holding:0,weight:.2,reserve:1.06};f.shareBlocks.push(block);}
 // Reconcile rounding to keep the external investor breakdown identical to PUBLIC.
 block.holding=roundShare(block.holding+roundShare(publicRatio-f.shareBlocks.reduce((a,b)=>a+b.holding,0)));
 if(block.holding<0)throw Error('株式の引受計算に失敗');
 f.sharesOutstanding=q.postShares;
 f.capitalPolicy.lastIssueMonth=month;f.capitalPolicy.issueCount++;

  before:before.owners.map(x=>({id:x.id,econ:x.econ})),after:f.owners.map(x=>({id:x.id,econ:x.econ}))};
 s.capitalHistory.unshift(entry);if(s.capitalHistory.length>120)s.capitalHistory.pop();
 const errs=check(s);if(errs.length)throw Error('新株発行後の検算失敗：'+errs[0]);

}

function staffingV023(f){

 const assembly=plants.filter(p=>['integrated','assembly'].includes(p.kind));
 const nominal=assembly.reduce((n,p)=>n+p.capacity,0);

 const details=(f.factoryOps?.mode==='detailed');
 const supportTarget=details?plants.filter(p=>!!v21ModuleType(p)).reduce((n,p)=>n+Math.ceil(Math.min(p.capacity*.35,f.factoryOps.plans?.[p.id]||0)*.35),0):0;
 const totalTarget=assemblyTarget+supportTarget;
 const researchActive=f.research?.tree?.active?.length||0;
 const researchGoal=Math.max(5,researchActive*8+(f.research?.roadmap?.targets?.length||0)*3);
 const salesCountries=Object.values(f.dealers||{}).filter(x=>Number(x)>0).length;
 const salesGoal=Math.max(5,5+salesCountries*4+(f.models||[]).filter(m=>m.status==='active').length*2);
 const normal=(actual,wanted)=>{const ratio=wanted?actual/wanted:1;return {actual,required:wanted,diff:actual-wanted,ratio,label:ratio<.5?'深刻な不足':ratio<.9?'不足':ratio<=1.10?'適正':ratio<=1.3?'やや多い':'過剰',kind:ratio<.9?'bad':ratio>1.3?'warn':'good'}};
 return {production:normal(f.staff.production||0,Math.max(1,totalTarget)),research:normal(f.staff.research||0,researchGoal),sales:normal(f.staff.sales||0,salesGoal),assemblyTarget,supportTarget};
}
function staffOfPlantV023(f,p){const all=staffingV023(f),active=(f.plants||[]).filter(x=>!x.construction&&!x.paused&&!x.renovation),weights=active.map(x=>['integrated','assembly'].includes(x.kind)?x.capacity:(f.factoryOps?.mode==='detailed'&&v21ModuleType(x)?x.capacity*.35:0));const total=weights.reduce((a,b)=>a+b,0);const index=active.findIndex(x=>x.id===p.id);const share=index<0||!total?0:weights[index]/total;const assigned=Math.floor((f.staff.production||0)*share),recommended=['integrated','assembly'].includes(p.kind)?Math.ceil(p.capacity*40/54):f.factoryOps?.mode==='detailed'&&v21ModuleType(p)?Math.ceil(Math.min(p.capacity*.35,f.factoryOps.plans?.[p.id]||0)*.35):0;return {assigned,recommended,ratio:recommended?assigned/recommended:1};}

function mkFirmSalesV025(f,code=null){const h=mkLastV025(f);if(!h)return null;return code===null?Object.values(h.markets||{}).reduce((v,m)=>v+(m.units||0),0):h.markets?.[code]?.units||0;}
function mkGroupSalesV025(code){let sum=0,has=false;for(const f of controlled()){if(f.industry!=='auto')continue;const q=mkFirmSalesV025(f,code);if(q!==null){has=true;sum+=q;}}return has?sum:null;}
function mkShareV025(code){const own=mkGroupSalesV025(code),all=mkObservedV025(code);return own===null||!all.hasRecord||!all.qty?null:Math.min(100,100*own/all.qty);}

document.addEventListener('click',e=>{if(!S)return;const region=e.target.closest('[data-mk-region]');if(region){VIEW_COUNTRY=region.dataset.mkRegion;MK_V025.region=VIEW_COUNTRY;PAGE='marketRegion';render();return;}const firm=e.target.closest('[data-mk-open-firm]');if(firm){MK_V025.selected=[firm.dataset.mkOpenFirm];MK_V025.page=0;MK_V025.query='';MK_V025.country='all';MK_V025.industry='all';PAGE='marketRivals';render();document.getElementById('mkRivalsCompare')?.scrollIntoView({block:'nearest'});return;}const action=e.target.closest('[data-mk-action]');if(!action)return;const cmd=action.dataset.mkAction;if(cmd==='prev'||cmd==='next'){MK_V025.page+=cmd==='next'?1:-1;mkRefreshRivalsV025();return;}if(cmd==='clear'){MK_V025.selected=[];mkRefreshRivalsV025();const e=document.getElementById('mkRivalsComparison');if(e)e.innerHTML=mkCompetitorCompareV025();return;}if(cmd==='compare'){const x=document.getElementById('mkRivalsComparison');if(x)x.innerHTML=mkCompetitorCompareV025();document.getElementById('mkRivalsCompare')?.scrollIntoView({block:'nearest',behavior:'smooth'});return;}});
document.addEventListener('change',e=>{const sel=e.target.closest('[data-mk-select]');if(sel){const id=sel.dataset.mkSelect;if(sel.checked&&!MK_V025.selected.includes(id)){if(MK_V025.selected.length>=4){sel.checked=false;toast('比較は最大4社までです');return;}MK_V025.selected.push(id);}if(!sel.checked)MK_V025.selected=MK_V025.selected.filter(x=>x!==id);mkRefreshRivalsV025();return;}const id=e.target.id;if(['mkRivalsCountry','mkRivalsIndustry','mkRivalsSort'].includes(id)){const key={mkRivalsCountry:'country',mkRivalsIndustry:'industry',mkRivalsSort:'sort'}[id];MK_V025[key]=e.target.value;MK_V025.page=0;mkRefreshRivalsV025();return;}if(e.target.closest('.mk-contract')){const x=document.getElementById('mkContractState');if(x)x.textContent='未保存の変更があります';}});
document.addEventListener('input',e=>{if(e.target.id==='mkRivalsQuery'){MK_V025.query=e.target.value;MK_V025.page=0;mkRefreshRivalsV025();}if(e.target.closest('.mk-contract')){const mark=document.getElementById('mkContractState');if(mark)mark.textContent='未保存の変更があります';}if(/^mkSim(Region|Price|Cost|Freight|Tariff|Fee|Qty)$/.test(e.target.id))mkUpdateDistributionQuoteV025();});
/* Update the export calculator on each visit; avoid resetting any input during typing. */
const mkPriorRenderV025=render;
render=function(){mkPriorRenderV025();if(PAGE==='distribution')mkUpdateDistributionQuoteV025();};

boot();
</script>
